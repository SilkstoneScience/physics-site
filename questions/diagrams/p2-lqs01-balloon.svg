<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 250" font-family="Arial, sans-serif" fill="#1c2430">
  <title>A helium weather balloon carrying a payload with a radio transmitter rises above a ground station</title>
  <!-- ground -->
  <line x1="10" y1="225" x2="350" y2="225" stroke="#1c2430" stroke-width="2"/>
  <!-- ground station with aerial -->
  <rect x="30" y="195" width="46" height="30" fill="#e3e7ee" stroke="#1c2430" stroke-width="1.5"/>
  <line x1="62" y1="195" x2="62" y2="165" stroke="#1c2430" stroke-width="1.5"/>
  <path d="M52 172 L62 165 L72 172 M55 180 L62 175 L69 180" fill="none" stroke="#1c2430" stroke-width="1.5"/>
  <text x="53" y="244" font-size="13" text-anchor="middle">ground station</text>
  <!-- balloon -->
  <path d="M235 30 C200 30 188 62 200 88 C210 108 228 118 235 124 C242 118 260 108 270 88 C282 62 270 30 235 30 Z" fill="#d6e4f7" stroke="#1f5fbf" stroke-width="2"/>
  <path d="M231 124 L239 124 L237 130 L233 130 Z" fill="#1f5fbf"/>
  <text x="285" y="62" font-size="13">helium</text>
  <text x="285" y="78" font-size="13">balloon</text>
  <!-- line to payload -->
  <line x1="235" y1="130" x2="235" y2="176" stroke="#1c2430" stroke-width="1.2"/>
  <!-- payload with transmitter -->
  <rect x="223" y="176" width="24" height="18" fill="#c45a00"/>
  <line x1="247" y1="180" x2="258" y2="170" stroke="#1c2430" stroke-width="1.5"/>
  <text x="262" y="190" font-size="13">payload and</text>
  <text x="262" y="206" font-size="13">radio transmitter</text>
  <!-- upward arrow -->
  <line x1="170" y1="150" x2="170" y2="95" stroke="#5b6675" stroke-width="2"/>
  <path d="M164 104 L170 94 L176 104" fill="none" stroke="#5b6675" stroke-width="2"/>
  <text x="160" y="170" font-size="12" fill="#5b6675" text-anchor="middle">rises</text>
</svg>
