<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" font-family="Arial, sans-serif" font-size="14">
  <!-- 200 J in = 160 units tall (0.8 units per J) -->
  <rect x="20" y="30" width="120" height="160" fill="#1f5fbf"/>
  <!-- light 30 J = 24 units, straight on -->
  <polygon points="140,30 300,30 300,22 335,42 300,62 300,54 140,54" fill="#1f5fbf"/>
  <!-- thermal 170 J = 136 units, bends down -->
  <polygon points="140,54 290,54 290,205 310,205 220,250 130,205 150,205 150,190 140,190" fill="#c2561a"/>
  <text x="80" y="104" text-anchor="middle" fill="#ffffff" font-weight="bold">electrical</text>
  <text x="80" y="124" text-anchor="middle" fill="#ffffff">200 J</text>
  <text x="225" y="47" text-anchor="middle" fill="#ffffff" font-weight="bold">light 30 J</text>
  <text x="220" y="130" text-anchor="middle" fill="#ffffff" font-weight="bold">thermal</text>
  <text x="220" y="150" text-anchor="middle" fill="#ffffff">170 J</text>
</svg>
