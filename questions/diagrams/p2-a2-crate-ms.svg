<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 250" width="320" height="250" font-family="Arial, sans-serif" fill="#1c2430">
  <title>Examiner's free-body diagram of the sliding crate: weight down and normal force up, equal lengths; tension forward and friction backward, equal lengths and shorter than the weight</title>
  <rect x="146" y="111" width="28" height="28" fill="#fff" stroke="#1c2430" stroke-width="1.5"/>
  <line x1="160.0" y1="125.0" x2="160.0" y2="225.0" stroke="#1f5fbf" stroke-width="2.5"/><path d="M156.1 216.9 L160.0 225.0 L163.9 216.9" fill="none" stroke="#1f5fbf" stroke-width="2.5"/>
  <line x1="160.0" y1="125.0" x2="160.0" y2="25.0" stroke="#1f5fbf" stroke-width="2.5"/><path d="M163.9 33.1 L160.0 25.0 L156.1 33.1" fill="none" stroke="#1f5fbf" stroke-width="2.5"/>
  <line x1="160.0" y1="125.0" x2="189.9" y2="125.0" stroke="#c2561a" stroke-width="2.5"/><path d="M181.8 128.9 L189.9 125.0 L181.8 121.1" fill="none" stroke="#c2561a" stroke-width="2.5"/>
  <line x1="160.0" y1="125.0" x2="130.1" y2="125.0" stroke="#c2561a" stroke-width="2.5"/><path d="M138.2 121.1 L130.1 125.0 L138.2 128.9" fill="none" stroke="#c2561a" stroke-width="2.5"/>
  <text x="170" y="229.0" font-size="14" fill="#1f5fbf">weight <tspan font-style="italic">W</tspan></text>
  <text x="170" y="31.0" font-size="14" fill="#1f5fbf">normal force <tspan font-style="italic">N</tspan></text>
  <text x="197.9" y="117" font-size="14" fill="#c2561a">tension <tspan font-style="italic">T</tspan></text>
  <text x="42.1" y="117" font-size="14" fill="#c2561a">friction <tspan font-style="italic">F</tspan><tspan font-style="italic" font-size="10" dy="3">f</tspan></text>
  <text x="12" y="243" font-size="12" fill="#5b6675">N = W; T = F<tspan font-size="9" dy="2">f</tspan><tspan dy="-2">, both much smaller than W</tspan></text>
</svg>
