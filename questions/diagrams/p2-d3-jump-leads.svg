<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 200" font-family="Arial, sans-serif" fill="#1c2430">
  <title>Two parallel jump leads seen from above, with their centres 2.5 cm apart, each carrying 160 A in opposite directions along a straight section 1.8 m long</title>
  <line x1="40" y1="70" x2="330" y2="70" stroke="#b3261e" stroke-width="7" stroke-linecap="round"/>
  <line x1="40" y1="130" x2="330" y2="130" stroke="#1c2430" stroke-width="7" stroke-linecap="round"/>
  <text x="40" y="52" font-size="14" font-weight="bold">red lead</text>
  <text x="40" y="158" font-size="14" font-weight="bold">black lead</text>
  <line x1="150" y1="46" x2="216" y2="46" stroke="#1f5fbf" stroke-width="2.5"/>
  <path d="M206 40 L218 46 L206 52" fill="none" stroke="#1f5fbf" stroke-width="2.5"/>
  <text x="226" y="51" font-size="14" fill="#1f5fbf">160 A</text>
  <line x1="216" y1="154" x2="150" y2="154" stroke="#1f5fbf" stroke-width="2.5"/>
  <path d="M160 148 L148 154 L160 160" fill="none" stroke="#1f5fbf" stroke-width="2.5"/>
  <text x="226" y="159" font-size="14" fill="#1f5fbf">160 A</text>
  <g stroke="#5b6675" stroke-width="1" stroke-dasharray="3 3"><line x1="336" y1="70" x2="372" y2="70"/><line x1="336" y1="130" x2="372" y2="130"/></g>
  <line x1="362" y1="70" x2="362" y2="130" stroke="#5b6675" stroke-width="1"/>
  <path d="M358 76 L362 70 L366 76 M358 124 L362 130 L366 124" fill="none" stroke="#5b6675" stroke-width="1"/>
  <text x="370" y="105" font-size="14">2.5 cm</text>
  <line x1="40" y1="184" x2="330" y2="184" stroke="#5b6675" stroke-width="1"/>
  <path d="M46 180 L40 184 L46 188 M324 180 L330 184 L324 188" fill="none" stroke="#5b6675" stroke-width="1"/>
  <text x="185" y="178" font-size="14" text-anchor="middle">1.8 m</text>
  <text x="414" y="196" font-size="11" text-anchor="end" fill="#5b6675">Not to scale</text>
</svg>
