<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 200" font-family="Arial, sans-serif" fill="#1c2430">
  <title>A jet of water leaves a hose nozzle at ground level with speed u at an angle θ above the horizontal and lands on level ground</title>
  <line x1="10" y1="172" x2="370" y2="172" stroke="#1c2430" stroke-width="2"/>
  <g stroke="#9aa5b4" stroke-width="1"><line x1="40" y1="172" x2="32" y2="182"/><line x1="80" y1="172" x2="72" y2="182"/><line x1="120" y1="172" x2="112" y2="182"/><line x1="160" y1="172" x2="152" y2="182"/><line x1="200" y1="172" x2="192" y2="182"/><line x1="240" y1="172" x2="232" y2="182"/><line x1="280" y1="172" x2="272" y2="182"/><line x1="320" y1="172" x2="312" y2="182"/></g>
  <text x="292" y="196" font-size="13">level ground</text>
  <!-- hose and nozzle -->
  <path d="M4 170 Q16 162 28 168" fill="none" stroke="#1c2430" stroke-width="5" stroke-linecap="round"/>
  <rect x="24" y="163" width="14" height="8" fill="#1c2430" transform="rotate(-35 34 168)"/>
  <text x="2" y="148" font-size="13">nozzle</text>
  <!-- water path, drawn with the same scale horizontally and vertically -->
  <polyline points="34,172 39,168.6 44,165.2 49,162 54,158.9 59,156 64,153.1 69,150.4 74,147.7 79,145.2 84,142.8 89,140.5 94,138.4 99,136.3 104,134.4 109,132.6 114,130.9 119,129.3 124,127.9 129,126.5 134,125.3 139,124.2 144,123.2 149,122.3 154,121.6 159,120.9 164,120.4 169,120 174,119.7 179,119.5 184,119.5 189,119.5 194,119.7 199,120 204,120.4 209,120.9 214,121.6 219,122.3 224,123.2 229,124.2 234,125.3 239,126.5 244,127.9 249,129.3 254,130.9 259,132.6 264,134.4 269,136.3 274,138.4 279,140.5 284,142.8 289,145.2 294,147.7 299,150.4 304,153.1 309,156 314,158.9 319,162 324,165.2 329,168.6 334,172" fill="none" stroke="#1f5fbf" stroke-width="2.5"/>
  <text x="166" y="109.5" font-size="13" fill="#1f5fbf">water</text>
  <!-- velocity arrow at the nozzle, along the tangent to the path, and the angle -->
  <line x1="34" y1="172" x2="83.1" y2="137.6" stroke="#c2561a" stroke-width="2.5"/>
  <path d="M74.1 137.4 L83.1 137.6 L80.2 146.1" fill="none" stroke="#c2561a" stroke-width="2.5"/>
  <text x="89.1" y="135.6" font-size="15" fill="#c2561a" font-style="italic">u</text>
  <line x1="34" y1="172" x2="104" y2="172" stroke="#9aa5b4" stroke-width="1" stroke-dasharray="3 3"/>
  <path d="M68 172 A34 34 0 0 0 61.9 152.5" fill="none" stroke="#c2561a" stroke-width="1.5"/>
  <text x="74" y="164" font-size="14" fill="#c2561a" font-style="italic">θ</text>
</svg>
