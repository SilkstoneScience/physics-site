  <line x1="40" y1="170" x2="89.1" y2="135.6" stroke="#c2561a" stroke-width="2.5"/>
  <path d="M80.3 137.1 L89.1 135.6 L84.6 143.4" fill="none" stroke="#c2561a" stroke-width="2.5"/>
  <text x="93.1" y="133.6" font-size="15" fill="#c2561a" font-style="italic">u</text>
  <line x1="40" y1="170" x2="110" y2="170" stroke="#9aa5b4" stroke-width="1" stroke-dasharray="3 3"/>
