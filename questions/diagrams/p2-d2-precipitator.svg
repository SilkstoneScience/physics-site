<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" font-family="Arial, sans-serif" fill="#1c2430">
  <title>Two large vertical metal plates of an electrostatic precipitator, with a smoke particle near the negative plate</title>
  <line x1="110" y1="34" x2="110" y2="200" stroke="#1c2430" stroke-width="5"/>
  <line x1="250" y1="34" x2="250" y2="200" stroke="#1c2430" stroke-width="5"/>
  <text x="110" y="24" font-size="16" font-weight="bold" text-anchor="middle">−</text>
  <text x="250" y="24" font-size="16" font-weight="bold" text-anchor="middle">+</text>

  <circle cx="124" cy="112" r="4" fill="#c2561a"/>
  <text x="132" y="108" font-size="12" fill="#c2561a">smoke particle</text>
  <path d="M180 190 L180 92" fill="none" stroke="#5b6675" stroke-width="1" stroke-dasharray="4 3"/>
  <path d="M175 100 L180 90 L185 100" fill="none" stroke="#5b6675" stroke-width="1"/>
  <text x="186" y="188" font-size="12" fill="#5b6675">flue gas</text>
  <text x="180" y="52" font-size="12" text-anchor="middle">p.d. 60 kV</text>
  <line x1="114" y1="222" x2="246" y2="222" stroke="#5b6675" stroke-width="1"/>
  <path d="M120 218 L114 222 L120 226 M240 218 L246 222 L240 226" fill="none" stroke="#5b6675" stroke-width="1"/>
  <text x="180" y="216" font-size="13" text-anchor="middle">0.30 m</text>
</svg>
