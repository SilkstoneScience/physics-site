<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 230" font-family="Arial, sans-serif" fill="#1c2430">
  <title>Frost alarm circuit: a battery in series with a fixed resistor R and a thermistor, with a voltmeter across the thermistor connected to the alarm</title>
  <g stroke="#1c2430" stroke-width="2" fill="none">
    <!-- top wire with battery -->
    <line x1="40" y1="40" x2="150" y2="40"/><line x1="170" y1="40" x2="280" y2="40"/>
    <line x1="150" y1="26" x2="150" y2="54"/><line x1="162" y1="32" x2="162" y2="48" stroke-width="4"/>
    <!-- left side down, fixed resistor -->
    <line x1="40" y1="40" x2="40" y2="70"/><rect x="28" y="70" width="24" height="50"/><line x1="40" y1="120" x2="40" y2="190"/>
    <!-- bottom wire -->
    <line x1="40" y1="190" x2="280" y2="190"/>
    <!-- right side: thermistor -->
    <line x1="280" y1="40" x2="280" y2="90"/><rect x="268" y="90" width="24" height="50"/><line x1="280" y1="140" x2="280" y2="190"/>
    <polyline points="258,150 266,150 296,82"/>
    <!-- voltmeter across thermistor -->
    <line x1="280" y1="70" x2="330" y2="70"/><line x1="330" y1="70" x2="330" y2="97"/>
    <line x1="330" y1="133" x2="330" y2="160"/><line x1="330" y1="160" x2="280" y2="160"/>
    <circle cx="330" cy="115" r="18"/>
  </g>
  <g fill="#1c2430"><circle cx="280" cy="70" r="3"/><circle cx="280" cy="160" r="3"/></g>
  <text x="330" y="120" font-size="15" text-anchor="middle">V</text>
  <text x="156" y="22" font-size="14" text-anchor="middle" font-style="italic">ε</text>
  <text x="62" y="100" font-size="14" font-style="italic">R</text>
  <text x="210" y="120" font-size="13">thermistor</text>
  <text x="300" y="185" font-size="12">to alarm</text>
</svg>
