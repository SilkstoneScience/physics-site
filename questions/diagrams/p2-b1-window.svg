<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 230" font-family="Arial, sans-serif" fill="#1c2430">
  <title>Cross-sections of two windows, not to scale: a single pane of glass between the room and the outside air, and a double-glazed unit of two panes with an air gap between them</title>
  <!-- left: single pane -->
  <text x="100" y="22" font-size="13" text-anchor="middle" font-weight="bold">single pane</text>
  <rect x="94" y="40" width="12" height="150" fill="#cfe0f5" stroke="#1f5fbf" stroke-width="1.5"/>
  <text x="60" y="120" font-size="12" text-anchor="middle">room</text>
  <text x="60" y="136" font-size="11" text-anchor="middle" fill="#c2561a">warm</text>
  <text x="142" y="120" font-size="12" text-anchor="middle">outside</text>
  <text x="142" y="136" font-size="11" text-anchor="middle" fill="#1f5fbf">cold</text>
  <text x="100" y="210" font-size="11" text-anchor="middle">glass</text>
  <!-- right: double-glazed unit -->
  <text x="290" y="22" font-size="13" text-anchor="middle" font-weight="bold">double-glazed unit</text>
  <rect x="266" y="40" width="12" height="150" fill="#cfe0f5" stroke="#1f5fbf" stroke-width="1.5"/>
  <rect x="302" y="40" width="12" height="150" fill="#cfe0f5" stroke="#1f5fbf" stroke-width="1.5"/>
  <rect x="278" y="40" width="24" height="150" fill="#f6f7f9" stroke="#1c2430" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="232" y="120" font-size="12" text-anchor="middle">room</text>
  <text x="232" y="136" font-size="11" text-anchor="middle" fill="#c2561a">warm</text>
  <text x="350" y="120" font-size="12" text-anchor="middle">outside</text>
  <text x="350" y="136" font-size="11" text-anchor="middle" fill="#1f5fbf">cold</text>
  <text x="272" y="210" font-size="11" text-anchor="middle">glass</text>
  <text x="308" y="210" font-size="11" text-anchor="middle">glass</text>
  <text x="290" y="34" font-size="10" text-anchor="middle">air gap</text>
  <line x1="290" y1="36" x2="290" y2="42" stroke="#1c2430" stroke-width="1"/>
</svg>
