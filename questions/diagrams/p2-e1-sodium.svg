<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 230" font-family="Arial, sans-serif" fill="#1c2430">
  <title>Four energy levels of a sodium atom, with one transition from level 1 to the ground state marked</title>
  <line x1="100" y1="200.0" x2="260" y2="200.0" stroke="#1c2430" stroke-width="2"/>
  <text x="92" y="204.0" font-size="13" text-anchor="end">−5.14 eV</text>
  <text x="268" y="204.0" font-size="13">ground state</text>
  <line x1="100" y1="134.6" x2="260" y2="134.6" stroke="#1c2430" stroke-width="2"/>
  <text x="92" y="138.6" font-size="13" text-anchor="end">−3.04 eV</text>
  <text x="268" y="138.6" font-size="13">level 1</text>
  <line x1="100" y1="100.7" x2="260" y2="100.7" stroke="#1c2430" stroke-width="2"/>
  <text x="92" y="104.7" font-size="13" text-anchor="end">−1.95 eV</text>
  <text x="268" y="104.7" font-size="13">level 2</text>
  <line x1="100" y1="83.3" x2="260" y2="83.3" stroke="#1c2430" stroke-width="2"/>
  <text x="92" y="87.3" font-size="13" text-anchor="end">−1.39 eV</text>
  <text x="268" y="87.3" font-size="13">level 3</text>
  <line x1="150" y1="134.6" x2="150" y2="197.0" stroke="#1f5fbf" stroke-width="2"/>
  <path d="M145 188.0 L150 197.0 L155 188.0" fill="none" stroke="#1f5fbf" stroke-width="2"/>
  <text x="156" y="171.3" font-size="12" fill="#1f5fbf">transition for (b)</text>
  <text x="30" y="20" font-size="13">energy</text>
</svg>
