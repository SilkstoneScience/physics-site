<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 190" font-family="Arial, sans-serif" fill="#1c2430">
  <title>A wooden crate on a horizontal concrete floor with a horizontal elastic cord attached to its right side, being pulled to the right</title>
  <!-- floor -->
  <rect x="10" y="150" width="360" height="14" fill="#d9dde3" stroke="#1c2430" stroke-width="1.5"/>
  <g stroke="#9aa5b4" stroke-width="1"><line x1="30" y1="164" x2="22" y2="174"/><line x1="70" y1="164" x2="62" y2="174"/><line x1="110" y1="164" x2="102" y2="174"/><line x1="150" y1="164" x2="142" y2="174"/><line x1="190" y1="164" x2="182" y2="174"/><line x1="230" y1="164" x2="222" y2="174"/><line x1="270" y1="164" x2="262" y2="174"/><line x1="310" y1="164" x2="302" y2="174"/><line x1="350" y1="164" x2="342" y2="174"/></g>
  <text x="14" y="190" font-size="13">rough concrete floor</text>
  <!-- crate with planks -->
  <rect x="60" y="60" width="110" height="90" fill="#e8d5b5" stroke="#1c2430" stroke-width="2"/>
  <g stroke="#b08a56" stroke-width="1.5"><line x1="60" y1="90" x2="170" y2="90"/><line x1="60" y1="120" x2="170" y2="120"/><line x1="97" y1="60" x2="97" y2="150"/><line x1="134" y1="60" x2="134" y2="150"/></g>
  <text x="90" y="50" font-size="14">crate</text>
  <!-- elastic cord: a stretched zigzag, horizontal, at mid-height -->
  <polyline points="170,105 182,105 188,97 200,113 212,97 224,113 236,97 248,113 260,97 272,113 284,97 296,113 302,105 318,105" fill="none" stroke="#c2561a" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="196" y="88" font-size="13" fill="#c2561a">elastic cord</text>
  <!-- the pull -->
  <line x1="318" y1="105" x2="356" y2="105" stroke="#1c2430" stroke-width="2.5"/>
  <path d="M348 100 L356 105 L348 110" fill="none" stroke="#1c2430" stroke-width="2.5"/>
  <text x="312" y="128" font-size="13">pull</text>
  <text x="300" y="30" font-size="12" fill="#5b6675">not to scale</text>
</svg>
