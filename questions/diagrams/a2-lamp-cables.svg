<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" font-family="Arial, sans-serif" font-size="14" fill="#1c2430">
  <!-- ceiling supports -->
  <rect x="10" y="20" width="20" height="40" fill="#b9c1cc"/>
  <rect x="330" y="20" width="20" height="40" fill="#b9c1cc"/>
  <!-- cables at 30 degrees to horizontal: from (30,40) and (330,40) to (180,126.6) -->
  <line x1="30" y1="40" x2="180" y2="126.6" stroke="#1c2430" stroke-width="2"/>
  <line x1="330" y1="40" x2="180" y2="126.6" stroke="#1c2430" stroke-width="2"/>
  <!-- horizontal reference and angle -->
  <line x1="30" y1="40" x2="110" y2="40" stroke="#1c2430" stroke-width="1" stroke-dasharray="5 4"/>
  <path d="M90 40 A 60 60 0 0 1 82 70" fill="none" stroke="#1c2430" stroke-width="1"/>
  <text x="96" y="66">30°</text>
  <line x1="330" y1="40" x2="250" y2="40" stroke="#1c2430" stroke-width="1" stroke-dasharray="5 4"/>
  <path d="M270 40 A 60 60 0 0 0 278 70" fill="none" stroke="#1c2430" stroke-width="1"/>
  <text x="240" y="66">30°</text>
  <!-- lamp -->
  <path d="M160 140 L200 140 L212 168 L148 168 Z" fill="#c2561a"/>
  <line x1="180" y1="126.6" x2="180" y2="140" stroke="#1c2430" stroke-width="2"/>
  <text x="222" y="160">3.0 kg</text>
</svg>
