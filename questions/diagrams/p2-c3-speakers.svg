<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 290" font-family="Arial, sans-serif" fill="#1c2430">
  <title>Plan view of two loudspeakers S1 and S2 connected to one signal generator, a dashed line along which the student walks, and a point P on it joined to each loudspeaker</title>
  <rect x="14" y="93.0" width="38" height="44" rx="4" fill="#e3e7ee" stroke="#1c2430" stroke-width="1.2"/>
  <text x="33" y="113.0" font-size="9" text-anchor="middle">signal</text><text x="33" y="125.0" font-size="9" text-anchor="middle">generator</text>
  <g stroke="#1c2430" stroke-width="1.2" fill="none"><path d="M52 107.0 L60 107.0 L60 70.0 L66 70.0"/><path d="M52 123.0 L60 123.0 L60 160.0 L66 160.0"/></g>
  <rect x="78" y="61.0" width="14" height="18" fill="#1c2430"/><path d="M92 61.0 L104 52.0 L104 88.0 L92 79.0 Z" fill="#e3e7ee" stroke="#1c2430" stroke-width="1.2"/><text x="72" y="75.0" font-size="14" text-anchor="end">S₁</text><rect x="78" y="151.0" width="14" height="18" fill="#1c2430"/><path d="M92 151.0 L104 142.0 L104 178.0 L92 169.0 Z" fill="#e3e7ee" stroke="#1c2430" stroke-width="1.2"/><text x="72" y="165.0" font-size="14" text-anchor="end">S₂</text>
  <line x1="219.1" y1="20" x2="219.1" y2="275" stroke="#1c2430" stroke-width="1.2" stroke-dasharray="6 4"/>
  <g stroke="#1f5fbf" stroke-width="1.5"><line x1="104.0" y1="70.0" x2="219.1" y2="243.0"/><line x1="104.0" y1="160.0" x2="219.1" y2="243.0"/></g>
  <circle cx="219.1" cy="243.0" r="4" fill="#1c2430"/>
  <text x="229.1" y="248.0" font-size="14">P</text>
  <text x="164.5" y="159.2" font-size="13" fill="#1f5fbf">7.40 m</text>
  <text x="155.5" y="223.8" font-size="13" fill="#1f5fbf" text-anchor="end">5.40 m</text>
  <text x="227.1" y="34" font-size="11">line along which</text><text x="227.1" y="48" font-size="11">the student walks</text>
</svg>
