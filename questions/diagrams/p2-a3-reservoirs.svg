<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 230" font-family="Arial, sans-serif" fill="#1c2430">
  <title>A mountain valley with an upper reservoir high on the left, a pipe down to a pump and turbine house, and a lower reservoir at the bottom right; arrows show water pumped up at night and flowing down by day</title>
  <!-- hillside -->
  <path d="M0 230 L0 90 L60 70 L150 70 L170 78 L250 150 L300 170 L400 175 L400 230 Z" fill="#e9eef3" stroke="#1c2430" stroke-width="1.5"/>
  <!-- upper reservoir -->
  <path d="M62 72 L148 72 L140 92 L70 92 Z" fill="#9ec3ee" stroke="#1f5fbf" stroke-width="1.5"/>
  <text x="54" y="60" font-size="13">upper reservoir</text>
  <!-- lower reservoir -->
  <path d="M300 172 L398 176 L392 198 L306 194 Z" fill="#9ec3ee" stroke="#1f5fbf" stroke-width="1.5"/>
  <text x="306" y="218" font-size="13">lower reservoir</text>
  <!-- pipe from the upper reservoir down to the turbine house -->
  <polyline points="140,88 200,120 248,176" fill="none" stroke="#1c2430" stroke-width="6" stroke-linecap="round"/>
  <polyline points="140,88 200,120 248,176" fill="none" stroke="#9ec3ee" stroke-width="3" stroke-linecap="round"/>
  <text x="150" y="128" font-size="12">pipe</text>
  <!-- pump and turbine house -->
  <rect x="236" y="172" width="54" height="26" fill="#fff" stroke="#1c2430" stroke-width="1.5"/>
  <text x="150" y="214" font-size="12">pumps and turbines</text>
  <line x1="290" y1="186" x2="306" y2="186" stroke="#1c2430" stroke-width="3"/>
  <!-- height marker: average height of the stored water above the turbines -->
  <line x1="30" y1="82" x2="30" y2="186" stroke="#1c2430" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="30" y1="186" x2="236" y2="186" stroke="#9aa5b4" stroke-width="1" stroke-dasharray="4 3"/>
  <path d="M26 92 L30 82 L34 92 M26 176 L30 186 L34 176" fill="none" stroke="#1c2430" stroke-width="1.2"/>
  <text x="8" y="140" font-size="13" font-style="italic">h</text>
  <!-- flow arrows -->
  <path d="M210 100 Q 240 86 268 104" fill="none" stroke="#c2561a" stroke-width="2" marker-end="url(#ah)"/>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c2561a"/></marker></defs>
  <text x="222" y="80" font-size="12" fill="#c2561a">day: water flows down</text>
  <path d="M238 168 Q 200 162 180 128" fill="none" stroke="#1f5fbf" stroke-width="2" marker-end="url(#ah2)"/>
  <defs><marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f5fbf"/></marker></defs>
  <text x="92" y="176" font-size="12" fill="#1f5fbf">night: pumped up</text>
  <text x="326" y="28" font-size="12" fill="#5b6675">not to scale</text>
</svg>
