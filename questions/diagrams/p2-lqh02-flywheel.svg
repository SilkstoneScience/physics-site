<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" font-family="Arial, sans-serif" fill="#1c2430">
  <title>The flywheel: a uniform disc of mass M and radius R spinning with angular speed ω about its centre</title>
  <!-- disc, seen face on -->
  <circle cx="160" cy="120" r="90" fill="#d6e4f7" stroke="#1f5fbf" stroke-width="2.5"/>
  <circle cx="160" cy="120" r="8" fill="#1c2430"/>
  <!-- radius -->
  <line x1="160" y1="120" x2="223.6" y2="56.4" stroke="#1c2430" stroke-width="1.5"/>
  <text x="200" y="98" font-size="15" font-style="italic">R</text>
  <text x="138" y="168" font-size="15" font-style="italic">M</text>
  <!-- rotation arrow -->
  <path d="M 64 92 A 102 102 0 0 1 132 22" fill="none" stroke="#c45a00" stroke-width="2.5"/>
  <path d="M120 20 L133 22 L124 31" fill="none" stroke="#c45a00" stroke-width="2.5"/>
  <text x="66" y="44" font-size="15" fill="#c45a00" font-style="italic">ω</text>
</svg>
