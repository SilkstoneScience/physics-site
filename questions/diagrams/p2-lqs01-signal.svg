<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 230" font-family="Arial, sans-serif" fill="#1c2430">
  <title>The radio signal travels in a straight line from the balloon, 20 km up and 30 km away horizontally, to the ground station</title>
  <line x1="10" y1="190" x2="350" y2="190" stroke="#1c2430" stroke-width="2"/>
  <!-- station -->
  <rect x="36" y="172" width="28" height="18" fill="#e3e7ee" stroke="#1c2430" stroke-width="1.5"/>
  <line x1="50" y1="172" x2="50" y2="158" stroke="#1c2430" stroke-width="1.5"/>
  <text x="72" y="184" font-size="13">ground station</text>
  <!-- balloon -->
  <ellipse cx="300" cy="38" rx="13" ry="16" fill="#d6e4f7" stroke="#1f5fbf" stroke-width="2"/>
  <line x1="300" y1="54" x2="300" y2="64" stroke="#1c2430" stroke-width="1"/>
  <rect x="295" y="64" width="10" height="7" fill="#c45a00"/>
  <!-- height and horizontal distance -->
  <line x1="300" y1="74" x2="300" y2="190" stroke="#5b6675" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="310" y="136" font-size="14">20 km</text>
  <line x1="50" y1="200" x2="300" y2="200" stroke="#5b6675" stroke-width="1"/>
  <path d="M56 196 L50 200 L56 204 M294 196 L300 200 L294 204" fill="none" stroke="#5b6675" stroke-width="1"/>
  <text x="175" y="225" font-size="14" text-anchor="middle">30 km</text>
  <!-- signal path -->
  <line x1="292" y1="72" x2="58" y2="160" stroke="#1f5fbf" stroke-width="2.5"/>
  <path d="M70 150 L58 160 L73 162" fill="none" stroke="#1f5fbf" stroke-width="2.5"/>
  <text x="168" y="104" font-size="13" fill="#1f5fbf" transform="rotate(-20.6 168 104)">radio signal</text>
  <text x="200" y="20" font-size="12" fill="#5b6675">not to scale</text>
</svg>
