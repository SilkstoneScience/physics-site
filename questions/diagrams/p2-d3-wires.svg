<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" font-family="Arial, sans-serif" fill="#1c2430">
  <title>Two long straight parallel wires P and Q, 6.0 cm apart, carrying currents of 15 A and 5.0 A in the same direction</title>
  <line x1="110" y1="20" x2="110" y2="190" stroke="#1c2430" stroke-width="4"/>
  <line x1="250" y1="20" x2="250" y2="190" stroke="#1c2430" stroke-width="4"/>
  <path d="M102 92 L110 76 L118 92" fill="none" stroke="#1f5fbf" stroke-width="2.5"/>
  <path d="M242 92 L250 76 L258 92" fill="none" stroke="#1f5fbf" stroke-width="2.5"/>
  <text x="96" y="16" font-size="15" font-weight="bold" text-anchor="end">P</text>
  <text x="264" y="16" font-size="15" font-weight="bold">Q</text>
  <text x="96" y="90" font-size="14" fill="#1f5fbf" text-anchor="end">15 A</text>
  <text x="264" y="90" font-size="14" fill="#1f5fbf">5.0 A</text>
  <line x1="114" y1="160" x2="246" y2="160" stroke="#5b6675" stroke-width="1"/>
  <path d="M120 156 L114 160 L120 164 M240 156 L246 160 L240 164" fill="none" stroke="#5b6675" stroke-width="1"/>
  <text x="180" y="152" font-size="14" text-anchor="middle">6.0 cm</text>
</svg>
