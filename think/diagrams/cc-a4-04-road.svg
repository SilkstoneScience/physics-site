<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210">
  <!-- left: the Earth with its axis and spin direction; right: a two-lane road seen from above, traffic on the right -->
  <text x="90" y="16" text-anchor="middle" style="font-size:14px">Earth spins</text>
  <path class="l3 thin" d="M62 38 Q90 22 118 38" marker-end="url(#ah3)"/>
  <line class="axis dash" x1="90" y1="30" x2="90" y2="182"/>
  <circle class="area" cx="90" cy="105" r="62"/><circle class="axis" cx="90" cy="105" r="62"/>
  <ellipse class="grid" cx="90" cy="105" rx="62" ry="14" style="fill:none"/>
  <path class="l1 thin" d="M54.4 54.2 A35.6 8 0 0 0 125.6 54.2"/>
  <text class="t1" x="90" y="80" text-anchor="middle" style="font-size:14px">road</text>
  <text x="68" y="196" style="font-size:14px">axis</text>
  <!-- the road, seen from above: north is up, east is to the right -->
  <rect class="axis" x="180" y="58" width="210" height="84" style="fill:var(--surface)"/>
  <line class="l3 thin dash" x1="184" y1="100" x2="386" y2="100"/>
  <!-- car in the northern lane, heading west -->
  <rect class="f3" x="238" y="64" width="11" height="4"/><rect class="f3" x="276" y="64" width="11" height="4"/>
  <rect class="f3" x="238" y="90" width="11" height="4"/><rect class="f3" x="276" y="90" width="11" height="4"/>
  <rect class="area" x="232" y="67" width="60" height="24" rx="7"/><rect class="axis" x="232" y="67" width="60" height="24" rx="7"/>
  <path class="l1 thin" d="M250 71 q-7 8 0 16 M278 71 q5 8 0 16" style="fill:none"/>
  <line class="l1" x1="224" y1="79" x2="198" y2="79" marker-end="url(#ah1)"/>
  <!-- car in the southern lane, heading east -->
  <rect class="f3" x="258" y="106" width="11" height="4"/><rect class="f3" x="296" y="106" width="11" height="4"/>
  <rect class="f3" x="258" y="132" width="11" height="4"/><rect class="f3" x="296" y="132" width="11" height="4"/>
  <rect class="area" x="252" y="109" width="60" height="24" rx="7"/><rect class="axis" x="252" y="109" width="60" height="24" rx="7"/>
  <path class="l1 thin" d="M294 113 q7 8 0 16 M266 113 q-5 8 0 16" style="fill:none"/>
  <line class="l1" x1="320" y1="121" x2="346" y2="121" marker-end="url(#ah1)"/>
  <text x="182" y="162">west</text>
  <text x="388" y="162" text-anchor="end">east</text>
  <line class="axis" x1="372" y1="206" x2="372" y2="176" marker-end="url(#ah3)"/>
  <text x="380" y="190">N</text>
</svg>
