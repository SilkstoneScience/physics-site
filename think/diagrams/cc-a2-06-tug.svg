<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <!-- two teams of three pulling on a rope, a flag marking its middle; no forces drawn -->
  <line class="axis" x1="0" y1="160" x2="400" y2="160"/>
  <!-- rope -->
  <line class="axis" x1="34" y1="100" x2="366" y2="100" style="stroke-width:2.5"/>
  <!-- flag at the middle of the rope -->
  <line class="axis" x1="200" y1="100" x2="200" y2="62"/><path class="f2" d="M200 62 L224 70 L200 78 Z"/>
  <!-- team A, leaning left: each figure is feet, legs, body, head and arms to the rope -->
  <circle class="axis" cx="36" cy="80" r="8" style="fill:var(--surface)"/><path class="axis" d="M40 88 L54 126 L62 160 M54 126 L70 160 M46 94 L72 100"/>
  <circle class="axis" cx="76" cy="80" r="8" style="fill:var(--surface)"/><path class="axis" d="M80 88 L94 126 L102 160 M94 126 L110 160 M86 94 L112 100"/>
  <circle class="axis" cx="116" cy="80" r="8" style="fill:var(--surface)"/><path class="axis" d="M120 88 L134 126 L142 160 M134 126 L150 160 M126 94 L152 100"/>
  <!-- team B, leaning right -->
  <circle class="axis" cx="364" cy="80" r="8" style="fill:var(--surface)"/><path class="axis" d="M360 88 L346 126 L338 160 M346 126 L330 160 M354 94 L328 100"/>
  <circle class="axis" cx="324" cy="80" r="8" style="fill:var(--surface)"/><path class="axis" d="M320 88 L306 126 L298 160 M306 126 L290 160 M314 94 L288 100"/>
  <circle class="axis" cx="284" cy="80" r="8" style="fill:var(--surface)"/><path class="axis" d="M280 88 L266 126 L258 160 M266 126 L250 160 M274 94 L248 100"/>
  <text x="92" y="188" text-anchor="middle">team A</text>
  <text x="308" y="188" text-anchor="middle">team B</text>
</svg>
