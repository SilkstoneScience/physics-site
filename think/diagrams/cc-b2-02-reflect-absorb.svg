<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 222">
  <!-- real-world colours (dark sea, white ice) so the picture is right in light and dark mode -->
  <rect x="0" y="130" width="380" height="44" style="fill:#1d4f7a"/>
  <path class="thin" style="stroke:#9cc3e6;fill:none;stroke-width:2" d="M206 138 q8 -5 16 0 q8 5 16 0 M322 140 q8 -5 16 0 q8 5 16 0 M218 164 q8 -5 16 0 q8 5 16 0 M336 164 q8 -5 16 0 q8 5 16 0"/>
  <path class="axis" d="M8 124 L34 116 L96 118 L150 113 L182 117 L192 126 L186 141 L120 144 L40 142 L10 136 Z" style="fill:#f2f7fb"/>
  <circle class="f2" cx="26" cy="24" r="14"/>
  <!-- on the ice: most of the sunlight is reflected -->
  <line class="l2" x1="58" y1="48" x2="96" y2="111" style="stroke-width:3.5" marker-end="url(#ah2)"/>
  <line class="l2" x1="100" y1="114" x2="138" y2="54" style="stroke-width:2.5" marker-end="url(#ah2)"/>
  <line class="l2" x1="100" y1="121" x2="106" y2="134" style="stroke-width:1.8" marker-end="url(#ah2)"/>
  <text class="t2" x="146" y="62" style="font-size:14px">60% reflected</text>
  <!-- on the open ocean: most of the sunlight is absorbed -->
  <line class="l2" x1="248" y1="60" x2="286" y2="123" style="stroke-width:3.5" marker-end="url(#ah2)"/>
  <line class="l2" x1="290" y1="128" x2="298" y2="114" style="stroke-width:1.2" marker-end="url(#ah2)"/>
  <line class="l2" x1="292" y1="134" x2="306" y2="160" style="stroke-width:3.4" marker-end="url(#ah2)"/>
  <text class="t2" x="374" y="104" text-anchor="end" style="font-size:14px">6% reflected</text>
  <text x="100" y="194" text-anchor="middle">sea ice</text>
  <text x="290" y="194" text-anchor="middle">open ocean</text>
  <text class="t2" x="100" y="214" text-anchor="middle" style="font-size:14px">40% absorbed</text>
  <text class="t2" x="290" y="214" text-anchor="middle" style="font-size:14px">94% absorbed</text>
</svg>
