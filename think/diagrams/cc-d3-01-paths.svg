<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 256">
  <!-- electric field: the protons speed up along a straight line -->
  <rect class="axis dash" x="120" y="25" width="220" height="80"/>
  <line class="axis" x1="128" y1="37" x2="330" y2="37" marker-end="url(#ah3)"/>
  <line class="axis" x1="128" y1="51" x2="330" y2="51" marker-end="url(#ah3)"/>
  <line class="axis" x1="128" y1="79" x2="330" y2="79" marker-end="url(#ah3)"/>
  <line class="axis" x1="128" y1="93" x2="330" y2="93" marker-end="url(#ah3)"/>
  <text x="352" y="71" text-anchor="middle">E</text>
  <line class="l2" x1="18" y1="65" x2="112" y2="65" marker-end="url(#ah2)"/>
  <text class="t2" x="62" y="54" text-anchor="middle">beam 1</text>
  <circle class="f2" cx="120" cy="65" r="4"/><circle class="f2" cx="143" cy="65" r="4"/><circle class="f2" cx="172" cy="65" r="4"/><circle class="f2" cx="207" cy="65" r="4"/><circle class="f2" cx="248" cy="65" r="4"/><circle class="f2" cx="295" cy="65" r="4"/>
  <text x="230" y="124" text-anchor="middle">gaps grow: speeding up</text>
  <!-- magnetic field: straight line at constant speed -->
  <rect class="axis dash" x="120" y="150" width="220" height="80"/>
  <line class="axis" x1="128" y1="162" x2="330" y2="162" marker-end="url(#ah3)"/>
  <line class="axis" x1="128" y1="176" x2="330" y2="176" marker-end="url(#ah3)"/>
  <line class="axis" x1="128" y1="204" x2="330" y2="204" marker-end="url(#ah3)"/>
  <line class="axis" x1="128" y1="218" x2="330" y2="218" marker-end="url(#ah3)"/>
  <text x="352" y="196" text-anchor="middle">B</text>
  <line class="l2" x1="18" y1="190" x2="112" y2="190" marker-end="url(#ah2)"/>
  <text class="t2" x="62" y="179" text-anchor="middle">beam 2</text>
  <circle class="f2" cx="120" cy="190" r="4"/><circle class="f2" cx="140" cy="190" r="4"/><circle class="f2" cx="160" cy="190" r="4"/><circle class="f2" cx="180" cy="190" r="4"/><circle class="f2" cx="200" cy="190" r="4"/><circle class="f2" cx="220" cy="190" r="4"/><circle class="f2" cx="240" cy="190" r="4"/><circle class="f2" cx="260" cy="190" r="4"/><circle class="f2" cx="280" cy="190" r="4"/><circle class="f2" cx="300" cy="190" r="4"/><circle class="f2" cx="320" cy="190" r="4"/>
  <text x="230" y="249" text-anchor="middle">equal gaps: constant speed</text>
</svg>
