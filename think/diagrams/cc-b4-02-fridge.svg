<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 210">
  <!-- walls and floor of the kitchen -->
  <rect class="axis" x="10" y="8" width="360" height="176"/>
  <line class="l3" x1="10" y1="184" x2="370" y2="184"/>
  <!-- closed window -->
  <rect class="l1 thin" x="30" y="28" width="64" height="52" style="fill:var(--surface)"/>
  <line class="l1 thin" x1="62" y1="28" x2="62" y2="80"/>
  <line class="l1 thin" x1="30" y1="54" x2="94" y2="54"/>
  <!-- thermometer on the wall -->
  <rect class="axis" x="56" y="104" width="8" height="54" rx="4" style="fill:var(--surface)"/>
  <rect class="f2" x="58" y="128" width="4" height="30"/>
  <circle class="f2" cx="60" cy="161" r="7"/>
  <text class="t2" x="74" y="140" style="font-size:20px">?</text>
  <!-- closed door -->
  <rect class="axis" x="124" y="54" width="56" height="130" style="fill:var(--surface)"/>
  <circle class="f3" cx="170" cy="122" r="3.5"/>
  <!-- wall socket and the fridge's cable -->
  <rect class="axis" x="192" y="146" width="14" height="14" rx="2" style="fill:var(--surface)"/>
  <path class="l3 thin" d="M222 176 C210 176 203 170 199 160"/>
  <!-- fridge with its door wide open -->
  <rect class="axis" x="220" y="34" width="76" height="150" rx="4" style="fill:var(--surface)"/>
  <rect class="axis" x="228" y="42" width="60" height="134" rx="2"/>
  <line class="grid" x1="228" y1="82" x2="288" y2="82"/>
  <line class="grid" x1="228" y1="118" x2="288" y2="118"/>
  <line class="grid" x1="228" y1="152" x2="288" y2="152"/>
  <rect class="area" x="236" y="58" width="10" height="24" rx="2"/>
  <rect class="area" x="252" y="66" width="24" height="16" rx="2"/>
  <rect class="area" x="256" y="96" width="24" height="22" rx="2"/>
  <rect class="area" x="238" y="132" width="18" height="20" rx="2"/>
  <path class="axis" d="M296 36 L336 50 L336 168 L296 182 Z" style="fill:var(--surface)"/>
  <line class="grid" x1="300" y1="90" x2="332" y2="96"/>
  <line class="grid" x1="300" y1="136" x2="332" y2="138"/>
  <text x="152" y="204" text-anchor="middle">door shut</text>
  <text x="270" y="204" text-anchor="middle">fridge open</text>
</svg>
