<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 160">
  <!-- alpha particle: two protons and two neutrons -->
  <circle class="axis" cx="102" cy="62" r="13" style="fill:var(--surface)"/>
  <circle class="axis" cx="82" cy="82" r="13" style="fill:var(--surface)"/>
  <circle class="f2" cx="82" cy="62" r="13"/><circle class="axis" cx="82" cy="62" r="13"/>
  <circle class="f2" cx="102" cy="82" r="13"/><circle class="axis" cx="102" cy="82" r="13"/>
  <text x="92" y="126" text-anchor="middle">alpha particle</text>
  <text class="t2" x="92" y="148" text-anchor="middle">charge +2e</text>
  <!-- electron -->
  <circle class="f1" cx="292" cy="72" r="6"/>
  <text x="292" y="126" text-anchor="middle">electron</text>
  <text class="t1" x="292" y="148" text-anchor="middle">charge −e</text>
  <!-- separation -->
  <line class="axis dash" x1="128" y1="72" x2="276" y2="72"/>
</svg>
