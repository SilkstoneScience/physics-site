<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 240">
  <!-- the cut-away Earth and tunnel again -->
  <circle class="area" cx="130" cy="125" r="95"/><circle class="axis" cx="130" cy="125" r="95"/>
  <rect x="124" y="30" width="12" height="190" style="fill:var(--surface)"/>
  <line class="axis" x1="124" y1="30" x2="124" y2="220"/>
  <line class="axis" x1="136" y1="30" x2="136" y2="220"/>
  <circle class="f3" cx="130" cy="125" r="2.5"/>
  <!-- velocity arrows beside the tunnel: longest at the centre, zero at both ends -->
  <circle class="f1" cx="156" cy="36" r="3"/>
  <line class="l1" x1="156" y1="66" x2="156" y2="84" marker-end="url(#ah1)"/>
  <line class="l1" x1="156" y1="104" x2="156" y2="146" marker-end="url(#ah1)"/>
  <line class="l1" x1="156" y1="166" x2="156" y2="184" marker-end="url(#ah1)"/>
  <circle class="f1" cx="156" cy="214" r="3"/>
  <!-- labels -->
  <text class="t1" x="236" y="41" style="font-size:14px">starts at rest</text>
  <text class="t1" x="236" y="82" style="font-size:14px">speeding up</text>
  <text class="t1" x="236" y="124" style="font-size:14px">fastest at the centre:</text>
  <text class="t1" x="236" y="144" style="font-size:14px">7.9 km s⁻¹</text>
  <text class="t1" x="236" y="182" style="font-size:14px">slowing down</text>
  <text class="t1" x="236" y="220" style="font-size:14px">stops at the far surface</text>
  <text x="10" y="236" style="font-size:14px">42 min end to end</text>
</svg>
