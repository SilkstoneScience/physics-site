<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220">
  <!-- side view: a flat top, a straight drop, a flat bottom; a four-car train waits at the top with its front car at the edge -->
  <path class="l3 thin" d="M60 80 V200 M150 80 V200 M225 123.3 V200"/>
  <line class="axis" x1="20" y1="200" x2="400" y2="200"/>
  <polyline class="axis" points="20,80 150,80 300,166.6 390,166.6" style="fill:none"/>
  <!-- the cars: body, two wheels, and a short coupling to the next car -->
  <rect class="area" x="32" y="58" width="26" height="15" rx="3"/><rect class="axis thin" x="32" y="58" width="26" height="15" rx="3" style="fill:none"/>
  <circle class="f3" cx="39" cy="76.5" r="3.5"/><circle class="f3" cx="51" cy="76.5" r="3.5"/>
  <rect class="area" x="62.67" y="58" width="26" height="15" rx="3"/><rect class="axis thin" x="62.67" y="58" width="26" height="15" rx="3" style="fill:none"/>
  <circle class="f3" cx="69.67" cy="76.5" r="3.5"/><circle class="f3" cx="81.67" cy="76.5" r="3.5"/>
  <rect class="area" x="93.33" y="58" width="26" height="15" rx="3"/><rect class="axis thin" x="93.33" y="58" width="26" height="15" rx="3" style="fill:none"/>
  <circle class="f3" cx="100.33" cy="76.5" r="3.5"/><circle class="f3" cx="112.33" cy="76.5" r="3.5"/>
  <rect class="area" x="124" y="58" width="26" height="15" rx="3"/><rect class="axis thin" x="124" y="58" width="26" height="15" rx="3" style="fill:none"/>
  <circle class="f3" cx="131" cy="76.5" r="3.5"/><circle class="f3" cx="143" cy="76.5" r="3.5"/>
  <path class="axis thin" d="M58 66 H62.67 M88.67 66 H93.33 M119.33 66 H124"/>
  <text x="90" y="40" text-anchor="middle">at rest</text>
  <text class="t1" x="45" y="104" text-anchor="middle" style="font-size:14px">last</text>
  <text class="t1" x="137" y="104" text-anchor="middle" style="font-size:14px">first</text>
  <!-- the height of the drop -->
  <line class="l3 thin dash" x1="300" y1="80" x2="350" y2="80"/>
  <line class="l3 thin" x1="340" y1="84" x2="340" y2="162" marker-start="url(#ah3)" marker-end="url(#ah3)"/>
  <text x="350" y="128">drop</text>
  <text x="345" y="190" text-anchor="middle">bottom</text>
</svg>
