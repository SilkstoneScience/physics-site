  <text x="195" y="108" text-anchor="middle">P</text>
  <circle class="f3" cx="130" cy="120" r="2"/>
  <text x="130" y="140" text-anchor="middle" style="font-size:14px">centre</text>
  <line class="axis" x1="258" y1="42" x2="204" y2="50"/>
  <text x="262" y="34">hollow metal</text>
  <text x="262" y="52">sphere</text>
