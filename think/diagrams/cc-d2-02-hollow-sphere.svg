  <circle class="axis" cx="130" cy="120" r="100"/><circle class="axis" cx="130" cy="120" r="92"/>
  <!-- positive charge on the outer surface -->
  <text class="t2" x="242.0" y="125.0" text-anchor="middle">+</text><text class="t2" x="227.0" y="181.0" text-anchor="middle">+</text><text class="t2" x="186.0" y="222.0" text-anchor="middle">+</text><text class="t2" x="130.0" y="237.0" text-anchor="middle">+</text><text class="t2" x="74.0" y="222.0" text-anchor="middle">+</text><text class="t2" x="33.0" y="181.0" text-anchor="middle">+</text><text class="t2" x="18.0" y="125.0" text-anchor="middle">+</text><text class="t2" x="33.0" y="69.0" text-anchor="middle">+</text><text class="t2" x="74.0" y="28.0" text-anchor="middle">+</text><text class="t2" x="130.0" y="13.0" text-anchor="middle">+</text><text class="t2" x="186.0" y="28.0" text-anchor="middle">+</text><text class="t2" x="227.0" y="69.0" text-anchor="middle">+</text>
