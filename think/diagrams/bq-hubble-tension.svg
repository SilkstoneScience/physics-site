<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <!-- scale: x = 40 + (H0 - 64) * 320/14, so 22.86 px per km/s/Mpc; bars drawn to scale from published values -->
  <line class="axis" x1="40" y1="150" x2="360" y2="150"/>
  <line class="axis thin" x1="40" y1="146" x2="40" y2="154"/><text x="40" y="172" text-anchor="middle" style="font-size:14px">64</text>
  <line class="axis thin" x1="85.7" y1="146" x2="85.7" y2="154"/><text x="85.7" y="172" text-anchor="middle" style="font-size:14px">66</text>
  <line class="axis thin" x1="131.4" y1="146" x2="131.4" y2="154"/><text x="131.4" y="172" text-anchor="middle" style="font-size:14px">68</text>
  <line class="axis thin" x1="177.1" y1="146" x2="177.1" y2="154"/><text x="177.1" y="172" text-anchor="middle" style="font-size:14px">70</text>
  <line class="axis thin" x1="222.9" y1="146" x2="222.9" y2="154"/><text x="222.9" y="172" text-anchor="middle" style="font-size:14px">72</text>
  <line class="axis thin" x1="268.6" y1="146" x2="268.6" y2="154"/><text x="268.6" y="172" text-anchor="middle" style="font-size:14px">74</text>
  <line class="axis thin" x1="314.3" y1="146" x2="314.3" y2="154"/><text x="314.3" y="172" text-anchor="middle" style="font-size:14px">76</text>
  <line class="axis thin" x1="360" y1="146" x2="360" y2="154"/><text x="360" y="172" text-anchor="middle" style="font-size:14px">78</text>
  <text x="200" y="194" text-anchor="middle" style="font-size:14px">H₀ in km/s per Mpc</text>
  <!-- Planck CMB: 67.4 ± 0.5 -->
  <line class="l1" x1="106.3" y1="56" x2="129.1" y2="56"/>
  <line class="l1" x1="106.3" y1="50" x2="106.3" y2="62"/><line class="l1" x1="129.1" y1="50" x2="129.1" y2="62"/>
  <circle class="f1" cx="117.7" cy="56" r="4"/>
  <text class="t1" x="117.7" y="40" text-anchor="middle" style="font-size:14px">CMB (Planck)</text>
  <!-- CCHP red giants: 70.4 ± 1.9 -->
  <line class="l3" x1="142.9" y1="92" x2="229.7" y2="92"/>
  <line class="l3" x1="142.9" y1="86" x2="142.9" y2="98"/><line class="l3" x1="229.7" y1="86" x2="229.7" y2="98"/>
  <circle class="f3" cx="186.3" cy="92" r="4"/>
  <text x="186.3" y="78" text-anchor="middle" style="font-size:14px">red giants (CCHP)</text>
  <!-- SH0ES Cepheids and supernovae: 73.0 ± 1.0 -->
  <line class="l2" x1="222.9" y1="128" x2="268.6" y2="128"/>
  <line class="l2" x1="222.9" y1="122" x2="222.9" y2="134"/><line class="l2" x1="268.6" y1="122" x2="268.6" y2="134"/>
  <circle class="f2" cx="245.7" cy="128" r="4"/>
  <text class="t2" x="300" y="114" text-anchor="middle" style="font-size:14px">supernovae (SH0ES)</text>
</svg>
