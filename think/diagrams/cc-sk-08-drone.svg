<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 214">
  <!-- flag due north of the drone -->
  <line class="l3" x1="120" y1="58" x2="120" y2="22"/>
  <path class="area" d="M120 22 L144 29 L120 36 Z"/><path class="axis" d="M120 22 L144 29 L120 36 Z"/>
  <circle class="f3" cx="120" cy="58" r="3"/>
  <text x="110" y="40" text-anchor="end">flag</text>
  <!-- heading relative to the air -->
  <line class="l1" x1="120" y1="156" x2="120" y2="86" marker-end="url(#ah1)"/>
  <text class="t1" x="108" y="126" text-anchor="end">3.0 m s⁻¹</text>
  <!-- drone: four rotors on crossed arms -->
  <line class="l3" x1="105" y1="167" x2="135" y2="197"/>
  <line class="l3" x1="135" y1="167" x2="105" y2="197"/>
  <circle class="l3 thin" cx="104" cy="166" r="8" style="fill:var(--surface)"/>
  <circle class="l3 thin" cx="136" cy="166" r="8" style="fill:var(--surface)"/>
  <circle class="l3 thin" cx="104" cy="198" r="8" style="fill:var(--surface)"/>
  <circle class="l3 thin" cx="136" cy="198" r="8" style="fill:var(--surface)"/>
  <rect class="area" x="113" y="175" width="14" height="14" rx="2"/><rect class="axis" x="113" y="175" width="14" height="14" rx="2"/>
  <text x="154" y="188">drone</text>
  <!-- wind -->
  <line class="l2" x1="222" y1="120" x2="342" y2="120" marker-end="url(#ah2)"/>
  <text class="t2" x="282" y="106" text-anchor="middle">wind 4.0 m s⁻¹</text>
  <!-- compass -->
  <line class="axis" x1="330" y1="66" x2="330" y2="30" marker-end="url(#ah3)"/>
  <text x="330" y="20" text-anchor="middle" style="font-size:14px">N</text>
</svg>
