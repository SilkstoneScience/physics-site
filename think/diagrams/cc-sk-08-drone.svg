<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 220">
  <!-- seen from above: drone pointing north towards a flag due north of it; the wind blows the air east -->
  <!-- flag due north of the drone -->
  <line class="l3" x1="120" y1="54" x2="120" y2="18"/>
  <path class="area" d="M120 18 L146 26 L120 34 Z"/><path class="axis" d="M120 18 L146 26 L120 34 Z"/>
  <circle class="f3" cx="120" cy="54" r="3"/>
  <text x="108" y="40" text-anchor="end">flag</text>
  <!-- velocity relative to the air, along the way the drone points -->
  <line class="l1" x1="120" y1="148" x2="120" y2="72" marker-end="url(#ah1)"/>
  <text class="t1" x="108" y="118" text-anchor="end">3.0 m s⁻¹</text>
  <!-- drone: crossed arms, four rotors with blades, body with a nose pointing north -->
  <path class="l3" d="M103 163 L137 197 M137 163 L103 197"/>
  <circle class="axis" cx="102" cy="162" r="10" style="fill:var(--surface)"/>
  <circle class="axis" cx="138" cy="162" r="10" style="fill:var(--surface)"/>
  <circle class="axis" cx="102" cy="198" r="10" style="fill:var(--surface)"/>
  <circle class="axis" cx="138" cy="198" r="10" style="fill:var(--surface)"/>
  <path class="l3 thin" d="M95 158 L109 166 M131 166 L145 158 M95 202 L109 194 M131 194 L145 202"/>
  <path class="axis" d="M112 172 L120 164 L128 172 V190 H112 Z" style="fill:var(--accent-soft)"/>
  <text x="156" y="184">drone</text>
  <!-- the wind: the whole body of air moves east -->
  <line class="l2" x1="224" y1="112" x2="344" y2="112" marker-end="url(#ah2)"/>
  <text class="t2" x="284" y="98" text-anchor="middle">wind 4.0 m s⁻¹</text>
  <line class="l2 thin" x1="244" y1="146" x2="324" y2="146" marker-end="url(#ah2)" style="opacity:0.6"/>
  <line class="l2 thin" x1="244" y1="176" x2="324" y2="176" marker-end="url(#ah2)" style="opacity:0.6"/>
  <!-- compass -->
  <line class="axis" x1="330" y1="62" x2="330" y2="28" marker-end="url(#ah3)"/>
  <text x="330" y="20" text-anchor="middle" style="font-size:14px">N</text>
</svg>
