<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 245">
  <!-- a cut-away hollow planet: a thick uniform shell with nothing inside -->
  <path class="area" fill-rule="evenodd" d="M30 120 A100 100 0 1 0 230 120 A100 100 0 1 0 30 120 Z M50 120 A80 80 0 1 0 210 120 A80 80 0 1 0 50 120 Z"/>
  <circle class="axis" cx="130" cy="120" r="100"/><circle class="axis" cx="130" cy="120" r="80"/>
  <circle class="f3" cx="130" cy="120" r="2.5"/>
  <text x="130" y="140" text-anchor="middle" style="font-size:14px">centre</text>
  <!-- the astronaut, floating nearer the right-hand wall -->
  <circle class="axis" cx="185" cy="104" r="7" style="fill:var(--surface)"/>
  <line class="l3 thin" x1="185" y1="111" x2="185" y2="126"/>
  <line class="l3 thin" x1="175" y1="122" x2="195" y2="116"/>
  <line class="l3 thin" x1="185" y1="126" x2="179" y2="138"/>
  <line class="l3 thin" x1="185" y1="126" x2="192" y2="137"/>
  <text x="164" y="158" text-anchor="middle" style="font-size:14px">astronaut</text>
  <!-- labels outside the shell -->
  <text x="250" y="52">thick shell</text>
  <line class="l3 thin" x1="246" y1="56" x2="212" y2="78"/>
  <text x="130" y="76" text-anchor="middle" style="font-size:14px">empty inside</text>
</svg>
