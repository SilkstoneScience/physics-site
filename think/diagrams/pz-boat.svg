  <ellipse class="f3" cx="150" cy="201" rx="5" ry="3" style="opacity:0.35"/><ellipse class="f3" cx="226" cy="202" rx="4" ry="2.5" style="opacity:0.35"/><ellipse class="f3" cx="296" cy="201" rx="6" ry="3" style="opacity:0.35"/>
