  <path class="axis" d="M122 90 L252 90 Q246 124 214 128 L158 128 Q128 124 122 90 Z" style="fill:var(--surface)"/>
  <path class="area" d="M126 110 L248 110 Q241 125 214 128 L158 128 Q132 125 126 110 Z" style="opacity:0.7"/>
