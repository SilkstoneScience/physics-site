  <path class="axis" d="M176 90 L174 80 L182 71 L197 72 L205 82 L203 90 Z" style="fill:var(--muted)"/>
  <text x="190" y="62" text-anchor="middle">rock</text>
  <line class="l3" x1="232" y1="78" x2="276" y2="124"/>
  <ellipse class="axis" cx="280" cy="128" rx="11" ry="4" transform="rotate(46 280 128)" style="fill:var(--surface)"/>
  <!-- where the rock will go -->
  <path class="l3 thin dash" d="M140 84 C112 88 100 140 104 186" marker-end="url(#ah3)"/>
  <path class="l3 thin dash" d="M96 204 L95 196 L101 189 L112 190 L117 197 L115 204 Z"/>
  <!-- depth gauge -->
  <rect class="axis" x="316" y="58" width="8" height="146" style="fill:var(--surface)"/>
  <path class="axis" d="M324 80 H329 M324 95 H329 M324 125 H329 M324 140 H329 M324 155 H329 M324 170 H329 M324 185 H329"/>
