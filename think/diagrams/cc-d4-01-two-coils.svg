  <!-- coil B, with a centre-zero meter -->
  <path class="l3 thin" d="M240 92 L248 52 M252 92 L260 52 M264 92 L272 52 M276 92 L284 52 M288 92 L296 52 M300 92 L308 52"/>
  <path class="wire" d="M240 92 V170 H284 M308 52 V44 H356 V170 H316"/>
