  <path class="l3 thin" d="M84 92 L92 52 M96 92 L104 52 M108 92 L116 52 M120 92 L128 52 M132 92 L140 52 M144 92 L152 52"/>
  <path class="wire" d="M84 92 V102 H44 V24 H88 M96 24 H120 M152 52 V44 H176 V24 H150"/>
