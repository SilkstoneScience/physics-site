<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <!-- left: a rigid helium-filled sphere just released above the ground; right: a submarine just below the surface of the sea; no forces drawn -->
  <line class="l3 thin dash" x1="200" y1="6" x2="200" y2="194"/>
  <!-- left scene: ground and the rigid sphere with a small basket -->
  <line class="axis" x1="0" y1="172" x2="196" y2="172"/>
  <circle class="l1" cx="100" cy="66" r="32" style="fill:var(--surface)"/>
  <path class="l3 thin" d="M86 95 L92 112 H108 L114 95"/>
  <rect class="axis thin" x="92" y="112" width="16" height="10" style="fill:var(--surface)"/>
  <text x="100" y="150" text-anchor="middle">rigid helium sphere</text>
  <!-- right scene: sea surface, water, submarine -->
  <rect class="area" x="204" y="60" width="196" height="140"/>
  <path class="axis" d="M204 60 q10 -5 20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t16 0"/>
  <ellipse class="axis" cx="300" cy="118" rx="52" ry="13" style="fill:var(--surface)"/>
  <rect class="axis" x="290" y="96" width="22" height="12" style="fill:var(--surface)"/>
  <line class="axis thin" x1="306" y1="96" x2="306" y2="84"/>
  <line class="axis thin" x1="306" y1="84" x2="314" y2="84"/>
  <path class="axis thin" d="M248 110 L240 104 V132 L248 126"/>
  <text x="300" y="160" text-anchor="middle">submarine</text>
  <text x="300" y="30" text-anchor="middle">sea</text>
  <text x="100" y="30" text-anchor="middle">air</text>
</svg>
