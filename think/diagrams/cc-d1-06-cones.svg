<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 245">
  <!-- the same hollow planet, with a narrow double cone through the astronaut's position P -->
  <path class="area" fill-rule="evenodd" d="M30 120 A100 100 0 1 0 230 120 A100 100 0 1 0 30 120 Z M50 120 A80 80 0 1 0 210 120 A80 80 0 1 0 50 120 Z"/>
  <circle class="axis" cx="130" cy="120" r="100"/><circle class="axis" cx="130" cy="120" r="80"/>
  <!-- cone edges (8 degrees either side of the line through the centre; points calculated with a script) -->
  <line class="l3 thin dash" x1="52.2" y1="101.3" x2="209.9" y2="123.5"/>
  <line class="l3 thin dash" x1="52.2" y1="138.7" x2="209.9" y2="116.5"/>
  <!-- the two patches of the inner wall that the cone cuts out -->
  <path class="l1" style="stroke-width:7" d="M209.9 116.5 A80 80 0 0 1 209.9 123.5"/>
  <path class="l2" style="stroke-width:7" d="M52.2 138.7 A80 80 0 0 1 52.2 101.3"/>
  <circle class="f3" cx="185" cy="120" r="3.5"/>
  <text x="185" y="108" text-anchor="middle">P</text>
  <text class="t1" x="236" y="150">near patch</text>
  <line class="l1 thin" x1="234" y1="144" x2="214" y2="126"/>
  <text class="t2" x="8" y="238">far patch</text>
  <line class="l2 thin" x1="30" y1="224" x2="40" y2="142"/>
</svg>
