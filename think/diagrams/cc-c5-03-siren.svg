<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 216">
  <!-- side view: straight road, ambulance heading right towards the listener at the roadside -->
  <line class="axis" x1="10" y1="120" x2="390" y2="120"/>
  <line class="axis" x1="10" y1="160" x2="390" y2="160"/>
  <path class="axis thin dash" d="M10 140 H390"/>
  <!-- ambulance: box body at the back, cab at the front (right) -->
  <path class="axis" d="M60 144 V90 Q60 86 64 86 H150 V96 L168 98 Q175 99 179 108 L186 124 V144 Z" style="fill:var(--surface)"/>
  <path class="area" d="M154 101 H167 Q171 102 174 108 L178 118 H154 Z"/>
  <line class="axis thin" x1="150" y1="96" x2="150" y2="144"/>
  <line class="l1 thin" x1="60" y1="128" x2="186" y2="128"/>
  <path class="l2" d="M104 98 v20 M94 108 h20" style="stroke-width:4"/>
  <rect class="f1" x="92" y="79" width="26" height="7" rx="2"/>
  <circle class="axis" cx="86" cy="144" r="10" style="fill:var(--surface)"/>
  <circle class="axis" cx="86" cy="144" r="3"/>
  <circle class="axis" cx="164" cy="144" r="10" style="fill:var(--surface)"/>
  <circle class="axis" cx="164" cy="144" r="3"/>
  <!-- siren sound from the light bar -->
  <path class="l2 thin" d="M86 70 q-6 8 0 16 M78 64 q-10 14 0 28 M124 70 q6 8 0 16 M132 64 q10 14 0 28"/>
  <text x="105" y="52" text-anchor="middle">siren on</text>
  <!-- steady velocity -->
  <line class="l1" x1="196" y1="110" x2="252" y2="110" marker-end="url(#ah1)"/>
  <text class="t1" x="196" y="98" style="font-size:14px">steady speed</text>
  <!-- listener standing at the roadside -->
  <circle class="l3 thin" cx="340" cy="172" r="7" style="fill:var(--surface)"/>
  <path class="l3 thin" d="M340 179 V198 M340 198 L333 212 M340 198 L347 212 M331 192 L340 184 L349 192"/>
  <text x="358" y="200">you</text>
</svg>
