<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 200">
  <!-- ground, and the thrower's arm and open hand, seen from the side -->
  <line class="axis" x1="0" y1="196" x2="380" y2="196"/>
  <path class="l3" d="M150 196 L174 150" style="stroke-width:4;fill:none"/>
  <path class="l3" d="M162 150 q14 -10 28 0" style="fill:var(--surface)"/>
  <path class="l3 thin" d="M164 146 L156 132 M171 143 L169 126 M178 143 L181 126 M186 146 L194 134"/>
  <!-- the ball, on its way up, with motion lines trailing below it -->
  <circle class="l3" cx="176" cy="58" r="13" style="fill:var(--surface)"/>
  <line class="l3 thin" x1="168" y1="78" x2="168" y2="98"/>
  <line class="l3 thin" x1="176" y1="78" x2="176" y2="106"/>
  <line class="l3 thin" x1="184" y1="78" x2="184" y2="98"/>
  <text x="204" y="64">ball, rising</text>
  <!-- air: a few swirls, to show the ball is moving through air, not a vacuum -->
  <path class="l1 thin" d="M50 50 q10 -10 20 0 t20 0 M60 110 q10 -10 20 0 t20 0 M250 100 q10 -10 20 0 t20 0 M280 150 q10 -10 20 0 t20 0 M80 160 q10 -10 20 0 t20 0" style="fill:none"/>
  <text class="t1" x="30" y="36">air</text>
</svg>
