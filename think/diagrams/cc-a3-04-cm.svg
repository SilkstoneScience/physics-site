<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -8 400 278">
  <!-- two moments, drawn to scale for a 24 m train on a 40 m, 30-degree slope (a 20 m drop). Top: the first car has just reached the bottom. Bottom: the last car has just reached the bottom. The orange dot is the train's centre of mass; the dashed line is its height at the start. -->
  <text x="20" y="12">first car reaches the bottom</text>
  <polyline class="axis" points="20,30 90,30 240,116.6 390,116.6" style="fill:none"/>
  <line class="l2 thin dash" x1="30" y1="22" x2="390" y2="22"/>
  <g transform="translate(240 116.6) rotate(-150)">
    <rect class="area" x="0" y="4.5" width="24" height="13" rx="3"/><rect class="axis thin" x="0" y="4.5" width="24" height="13" rx="3" style="fill:none"/>
    <circle class="f3" cx="6" cy="3" r="3"/><circle class="f3" cx="18" cy="3" r="3"/>
    <rect class="area" x="26.67" y="4.5" width="24" height="13" rx="3"/><rect class="axis thin" x="26.67" y="4.5" width="24" height="13" rx="3" style="fill:none"/>
    <circle class="f3" cx="32.67" cy="3" r="3"/><circle class="f3" cx="44.67" cy="3" r="3"/>
    <rect class="area" x="53.33" y="4.5" width="24" height="13" rx="3"/><rect class="axis thin" x="53.33" y="4.5" width="24" height="13" rx="3" style="fill:none"/>
    <circle class="f3" cx="59.33" cy="3" r="3"/><circle class="f3" cx="71.33" cy="3" r="3"/>
    <rect class="area" x="80" y="4.5" width="24" height="13" rx="3"/><rect class="axis thin" x="80" y="4.5" width="24" height="13" rx="3" style="fill:none"/>
    <circle class="f3" cx="86" cy="3" r="3"/><circle class="f3" cx="98" cy="3" r="3"/>
    <path class="axis thin" d="M24 11 H26.67 M50.67 11 H53.33 M77.33 11 H80"/>
  </g>
  <line class="l2 thin" x1="199" y1="22" x2="199" y2="76" marker-end="url(#ah2)"/>
  <circle class="f2" cx="199" cy="83.7" r="4"/>
  <text class="t2" x="208" y="60">14 m</text>
  <text x="20" y="152">last car reaches the bottom</text>
  <polyline class="axis" points="20,170 90,170 240,256.6 390,256.6" style="fill:none"/>
  <line class="l2 thin dash" x1="30" y1="162" x2="390" y2="162"/>
  <rect class="area" x="240" y="239.1" width="24" height="13" rx="3"/><rect class="axis thin" x="240" y="239.1" width="24" height="13" rx="3" style="fill:none"/>
  <circle class="f3" cx="246" cy="253.6" r="3"/><circle class="f3" cx="258" cy="253.6" r="3"/>
  <rect class="area" x="266.67" y="239.1" width="24" height="13" rx="3"/><rect class="axis thin" x="266.67" y="239.1" width="24" height="13" rx="3" style="fill:none"/>
  <circle class="f3" cx="272.67" cy="253.6" r="3"/><circle class="f3" cx="284.67" cy="253.6" r="3"/>
  <rect class="area" x="293.33" y="239.1" width="24" height="13" rx="3"/><rect class="axis thin" x="293.33" y="239.1" width="24" height="13" rx="3" style="fill:none"/>
  <circle class="f3" cx="299.33" cy="253.6" r="3"/><circle class="f3" cx="311.33" cy="253.6" r="3"/>
  <rect class="area" x="320" y="239.1" width="24" height="13" rx="3"/><rect class="axis thin" x="320" y="239.1" width="24" height="13" rx="3" style="fill:none"/>
  <circle class="f3" cx="326" cy="253.6" r="3"/><circle class="f3" cx="338" cy="253.6" r="3"/>
  <path class="axis thin" d="M264 245.6 H266.67 M290.67 245.6 H293.33 M317.33 245.6 H320"/>
  <line class="l2 thin" x1="292" y1="162" x2="292" y2="241" marker-end="url(#ah2)"/>
  <circle class="f2" cx="292" cy="248.6" r="4"/>
  <text class="t2" x="301" y="210">20 m</text>
</svg>
