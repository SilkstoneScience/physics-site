<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 205">
  <!-- open water -->
  <!-- real-world colours (dark sea, white ice) so the picture is right in light and dark mode -->
  <rect x="0" y="130" width="380" height="44" style="fill:#1d4f7a"/>
  <path class="thin" style="stroke:#9cc3e6;fill:none;stroke-width:2" d="M206 138 q8 -5 16 0 q8 5 16 0 M262 152 q8 -5 16 0 q8 5 16 0 M322 140 q8 -5 16 0 q8 5 16 0 M218 164 q8 -5 16 0 q8 5 16 0 M300 166 q8 -5 16 0 q8 5 16 0"/>
  <!-- a floe of sea ice floating in it -->
  <path class="axis" d="M8 124 L34 116 L96 118 L150 113 L182 117 L192 126 L186 141 L120 144 L40 142 L10 136 Z" style="fill:#f2f7fb"/>
  <path class="grid" d="M36 124 L60 122 M120 122 L150 120 M80 134 L104 135"/>
  <!-- the Sun and parallel sunlight -->
  <circle class="f2" cx="26" cy="24" r="14"/>
  <g class="l2 thin" marker-end="url(#ah2)">
    <line x1="56" y1="44" x2="96" y2="110"/><line x1="122" y1="44" x2="162" y2="110"/>
    <line x1="232" y1="44" x2="278" y2="122"/><line x1="298" y1="44" x2="344" y2="122"/>
  </g>
  <text class="t2" x="150" y="30">sunlight</text>
  <text x="100" y="194" text-anchor="middle">sea ice</text>
  <text x="290" y="194" text-anchor="middle">open ocean</text>
</svg>
