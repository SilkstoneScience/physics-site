<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220">
  <!-- a hemispherical igloo on snowy ground with a child sitting at the very top; no arrows -->
  <rect class="area" x="0" y="180" width="400" height="40"/>
  <line class="axis" x1="0" y1="180" x2="400" y2="180"/>
  <!-- dome (hemisphere, centre 200,180 radius 110) -->
  <path class="axis" d="M90 180 A110 110 0 0 1 310 180" style="fill:var(--surface)"/>
  <!-- snow block lines -->
  <path class="l3 thin" d="M94.2 150 H305.8 M103 128 H297 M124.5 100 H275.5 M154.2 80 H245.8"/>
  <path class="l3 thin" d="M130 150 V180 M165 150 V180 M200 150 V180 M235 150 V180 M270 150 V180 M112 128 V150 M148 128 V150 M183 128 V150 M218 128 V150 M253 128 V150 M288 128 V150 M140 100 V128 M170 100 V128 M200 100 V128 M230 100 V128 M260 100 V128 M165 80 V100 M185 80 V100 M215 80 V100 M235 80 V100"/>
  <!-- entrance tunnel at the left -->
  <path class="axis" d="M58 180 A26 26 0 0 1 110 180" style="fill:var(--surface)"/>
  <path class="axis" d="M68 180 A16 16 0 0 1 100 180" style="fill:var(--surface)"/>
  <!-- child sitting at the top -->
  <circle class="axis" cx="200" cy="44" r="7" style="fill:var(--surface)"/>
  <path class="axis thin" d="M200 51 V66 M200 56 L190 62 M200 56 L210 62 M200 66 L212 70 L216 60 M200 66 L190 70"/>
  <text x="180" y="44" text-anchor="end" style="font-size:14px">at rest</text>
  <text x="330" y="210">snow</text>
</svg>
