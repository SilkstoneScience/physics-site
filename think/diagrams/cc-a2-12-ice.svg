<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <!-- a person with a backpack standing in the middle of a wide frozen lake; the shore with trees is far away to the right; no arrows -->
  <!-- ice -->
  <rect class="area" x="0" y="130" width="400" height="70"/>
  <line class="axis" x1="0" y1="130" x2="400" y2="130"/>
  <path class="l3 thin" d="M40 150 l18 6 l14 -3 M240 154 l20 5 l16 -4 M300 146 l14 4"/>
  <!-- distant shore: bank and trees -->
  <path class="axis" d="M330 130 L344 120 H400" style="fill:var(--surface)"/>
  <path class="axis" d="M352 120 L360 98 L368 120 Z M372 120 L380 94 L388 120 Z M392 120 L398 102 L400 106 V120 Z" style="fill:var(--surface)"/>
  <text x="396" y="146" text-anchor="end" style="font-size:14px">shore</text>
  <!-- person standing in the middle, backpack on their back -->
  <circle class="axis" cx="150" cy="70" r="8" style="fill:var(--surface)"/>
  <path class="axis" d="M150 78 V108 M150 86 L138 100 M150 86 L162 102 M150 108 L142 130 M150 108 L158 130"/>
  <rect class="axis" x="156" y="80" width="14" height="22" rx="3" style="fill:var(--surface)"/>
  <text x="128" y="60" text-anchor="end" style="font-size:14px">backpack</text>
  <text x="200" y="186" text-anchor="middle">perfectly frictionless ice</text>
</svg>
