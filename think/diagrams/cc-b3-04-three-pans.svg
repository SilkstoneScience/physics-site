<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <!-- three pans of water: on a mountain top, at sea level, and in a pressure cooker; every thermometer reading is hidden -->
  <!-- mountain with a flat summit -->
  <path class="area" d="M4 170 L44 90 H76 L116 170 Z"/><path class="axis" d="M4 170 L44 90 H76 L116 170"/>
  <!-- pan on the summit -->
  <rect class="axis" x="47" y="74" width="26" height="16" style="fill:var(--surface)"/><line class="axis" x1="73" y1="75" x2="90" y2="72"/>
  <line class="l1 thin" x1="52" y1="80" x2="68" y2="80"/>
  <line class="axis thin" x1="60" y1="74" x2="60" y2="62"/><text x="60" y="56" text-anchor="middle">?</text>
  <text x="60" y="192" text-anchor="middle">3000 m up</text>
  <!-- sea level: waves, stove and open pan -->
  <path class="l1 thin" d="M126 170 q10 -6 20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0"/>
  <rect class="axis" x="172" y="150" width="56" height="20" style="fill:var(--surface)"/>
  <rect class="axis" x="176" y="120" width="48" height="30" style="fill:var(--surface)"/><line class="axis" x1="224" y1="122" x2="246" y2="118"/>
  <line class="l1 thin" x1="182" y1="130" x2="218" y2="130"/>
  <line class="axis thin" x1="200" y1="120" x2="200" y2="106"/><text x="200" y="100" text-anchor="middle">?</text>
  <text x="200" y="192" text-anchor="middle">sea level</text>
  <!-- pressure cooker: pan with a locked lid and a valve, on a stove -->
  <rect class="axis" x="296" y="160" width="78" height="10" style="fill:var(--surface)"/>
  <rect class="axis" x="302" y="118" width="66" height="42" style="fill:var(--surface)"/>
  <rect class="axis" x="298" y="110" width="74" height="8" rx="3" style="fill:var(--surface)"/>
  <rect class="f3" x="331" y="100" width="8" height="10"/><line class="axis" x1="335" y1="100" x2="335" y2="92"/>
  <line class="axis" x1="290" y1="128" x2="302" y2="128"/><line class="axis" x1="368" y1="128" x2="380" y2="128"/>
  <line class="axis thin" x1="352" y1="100" x2="352" y2="92"/><text x="352" y="86" text-anchor="middle">?</text>
  <text x="325" y="192" text-anchor="middle">pressure cooker</text>
</svg>
