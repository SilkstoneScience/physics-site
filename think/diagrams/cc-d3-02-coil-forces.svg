<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 220">
  <!-- the poles of a magnet -->
  <rect class="area" x="20" y="35" width="70" height="150" rx="3"/><rect class="axis" x="20" y="35" width="70" height="150" rx="3"/>
  <rect class="area" x="290" y="35" width="70" height="150" rx="3"/><rect class="axis" x="290" y="35" width="70" height="150" rx="3"/>
  <text x="55" y="120" text-anchor="middle" style="font-size:28px">N</text>
  <text x="325" y="120" text-anchor="middle" style="font-size:28px">S</text>
  <!-- uniform field lines from N to S -->
  <line class="axis" x1="92" y1="56" x2="286" y2="56" marker-end="url(#ah3)"/>
  <line class="axis" x1="92" y1="74" x2="286" y2="74" marker-end="url(#ah3)"/>
  <line class="axis" x1="92" y1="92" x2="286" y2="92" marker-end="url(#ah3)"/>
  <line class="axis" x1="92" y1="128" x2="286" y2="128" marker-end="url(#ah3)"/>
  <line class="axis" x1="92" y1="146" x2="286" y2="146" marker-end="url(#ah3)"/>
  <line class="axis" x1="92" y1="164" x2="286" y2="164" marker-end="url(#ah3)"/>
  <!-- the coil seen end-on -->
  <line class="l3 thin" x1="150" y1="110" x2="230" y2="110"/>
  <circle class="axis" cx="150" cy="110" r="10" style="fill:var(--surface)"/>
  <line class="axis" x1="143.9" y1="103.9" x2="156.1" y2="116.1"/><line class="axis" x1="143.9" y1="116.1" x2="156.1" y2="103.9"/>
  <circle class="axis" cx="230" cy="110" r="10" style="fill:var(--surface)"/>
  <circle class="f3" cx="230" cy="110" r="3"/>
  <circle class="f3" cx="190" cy="110" r="4"/>
  <!-- forces on the two sides, and the turning they cause -->
  <line class="l1" x1="150" y1="123" x2="150" y2="180" marker-end="url(#ah1)"/>
  <text class="t1" x="140" y="178" text-anchor="end">F</text>
  <line class="l1" x1="230" y1="97" x2="230" y2="40" marker-end="url(#ah1)"/>
  <text class="t1" x="240" y="48">F</text>
  <path class="l3 thin" d="M175.0 115.5 A16 16 0 0 0 205.0 115.5" marker-end="url(#ah3)"/>
  <text x="190" y="210" text-anchor="middle">the coil turns anticlockwise</text>
</svg>
