<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <!-- table top -->
  <line class="axis" x1="20" y1="170" x2="380" y2="170"/>
  <!-- coffee cup: body, handle, coffee surface, steam -->
  <path class="axis" d="M70 92 L80 170 H150 L160 92 Z" style="fill:var(--surface)"/>
  <path class="axis" d="M160 104 q34 0 30 26 q-4 22 -36 24"/>
  <ellipse class="f2" cx="115" cy="92" rx="45" ry="7"/>
  <path class="l3 thin" d="M98 76 q6 -10 0 -20 q-6 -10 0 -20 M116 72 q6 -10 0 -20 q-6 -10 0 -20 M134 76 q6 -10 0 -20 q-6 -10 0 -20"/>
  <text x="115" y="192" text-anchor="middle">hot coffee</text>
  <!-- milk jug: body, lip, handle, milk surface -->
  <path class="axis" d="M218 118 L222 170 H268 L272 118 L278 110 L214 110 Z" style="fill:var(--surface)"/>
  <path class="axis" d="M272 126 q22 0 20 16 q-2 14 -24 16"/>
  <ellipse class="area" cx="245" cy="118" rx="26" ry="4"/>
  <text x="245" y="192" text-anchor="middle">cold milk</text>
  <!-- clock: five minutes to wait -->
  <circle class="axis" cx="340" cy="70" r="30" style="fill:var(--surface)"/>
  <line class="axis thin" x1="340" y1="42" x2="340" y2="46"/><line class="axis thin" x1="368" y1="70" x2="364" y2="70"/>
  <line class="axis thin" x1="340" y1="98" x2="340" y2="94"/><line class="axis thin" x1="312" y1="70" x2="316" y2="70"/>
  <line class="axis" x1="340" y1="70" x2="340" y2="50"/>
  <line class="l1" x1="340" y1="70" x2="358" y2="56" marker-end="url(#ah1)"/>
  <path class="l1 thin" d="M340 44 A26 26 0 0 1 362.5 57" />
  <text class="t1" x="340" y="118" text-anchor="middle">5 minutes</text>
</svg>
