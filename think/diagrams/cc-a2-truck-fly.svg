<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 190">
  <rect class="area" x="0" y="160" width="380" height="8"/>
  <line class="axis" x1="0" y1="160" x2="380" y2="160"/>
  <!-- speed lines -->
  <line class="l3 thin dash" x1="4" y1="70" x2="26" y2="70"/>
  <line class="l3 thin dash" x1="0" y1="92" x2="26" y2="92"/>
  <line class="l3 thin dash" x1="4" y1="114" x2="26" y2="114"/>
  <!-- cargo box -->
  <rect class="area" x="34" y="46" width="142" height="84" rx="3"/><rect class="axis" x="34" y="46" width="142" height="84" rx="3"/>
  <line class="grid" x1="81" y1="50" x2="81" y2="126"/><line class="grid" x1="129" y1="50" x2="129" y2="126"/>
  <line class="l3" x1="30" y1="132" x2="262" y2="132"/>
  <!-- cab: sloping windscreen, side window, door, headlight, bumper -->
  <path class="area" d="M180 132 V62 H224 L250 100 V132 Z"/>
  <path class="axis" d="M180 132 V62 H224 L250 100 V132 Z"/>
  <path class="l1" d="M226 66 L248 98" style="stroke-width:4"/>
  <path class="l1 thin" d="M188 70 H218 L232 92 H188 Z" style="fill:var(--surface)"/>
  <line class="axis" x1="186" y1="98" x2="186" y2="128"/><line class="axis" x1="212" y1="112" x2="220" y2="112"/>
  <circle class="f2" cx="246" cy="112" r="4"/>
  <rect class="axis" x="248" y="120" width="12" height="12" rx="2" style="fill:var(--surface)"/>
  <!-- mudguards and wheels -->
  <path class="l3" d="M53 132 A21 21 0 0 1 95 132"/>
  <path class="l3" d="M97 132 A21 21 0 0 1 139 132"/>
  <path class="l3" d="M204 132 A22 22 0 0 1 248 132"/>
  <circle class="l3" cx="74" cy="144" r="16" style="fill:var(--surface)"/><circle class="area" cx="74" cy="144" r="6"/><circle class="axis" cx="74" cy="144" r="6"/>
  <circle class="l3" cx="118" cy="144" r="16" style="fill:var(--surface)"/><circle class="area" cx="118" cy="144" r="6"/><circle class="axis" cx="118" cy="144" r="6"/>
  <circle class="l3" cx="226" cy="144" r="16" style="fill:var(--surface)"/><circle class="area" cx="226" cy="144" r="6"/><circle class="axis" cx="226" cy="144" r="6"/>
  <line class="l1" x1="80" y1="24" x2="150" y2="24" marker-end="url(#ah1)"/>
  <text class="t1" x="158" y="30">moving</text>
  <!-- the fly, real size, with an enlarged view in a dashed circle -->
  <circle class="f3" cx="276" cy="94" r="2.5"/>
  <line class="grid dash" x1="279" y1="91" x2="316" y2="72"/>
  <circle class="l3 thin dash" cx="336" cy="56" r="34" style="fill:var(--surface)"/>
  <ellipse class="area" cx="340" cy="44" rx="12" ry="6" transform="rotate(-25 340 44)"/><ellipse class="axis" cx="340" cy="44" rx="12" ry="6" transform="rotate(-25 340 44)"/>
  <ellipse class="area" cx="346" cy="48" rx="12" ry="6" transform="rotate(-50 346 48)"/><ellipse class="axis" cx="346" cy="48" rx="12" ry="6" transform="rotate(-50 346 48)"/>
  <path class="l3 thin" d="M330 64 L324 74 M338 66 L336 77 M346 64 L350 74"/>
  <ellipse class="f3" cx="340" cy="60" rx="13" ry="7"/>
  <circle class="f3" cx="323" cy="58" r="6.5"/>
  <circle class="f2" cx="320" cy="56" r="2.5"/>
  <text x="336" y="110" text-anchor="middle">fly</text>
</svg>
