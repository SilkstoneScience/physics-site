<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <!-- the answer: on Earth a tall yellow teardrop flame; in orbit a small, dim, blue sphere around the wick. Flame colours are fixed because a flame has real colours. -->
  <!-- Earth candle -->
  <line class="axis" x1="40" y1="180" x2="160" y2="180"/>
  <rect class="axis" x="84" y="112" width="32" height="68" style="fill:var(--surface)"/>
  <line class="axis" x1="100" y1="112" x2="100" y2="100"/>
  <path d="M100 48 C114 70 118 86 100 104 C82 86 86 70 100 48 Z" fill="#f6a623"/>
  <path d="M100 66 C108 78 110 88 100 98 C90 88 92 78 100 66 Z" fill="#ffe27a"/>
  <path d="M100 92 C106 96 106 102 100 104 C94 102 94 96 100 92 Z" fill="#4a86e8"/>
  <text x="100" y="196" text-anchor="middle">on Earth</text>
  <!-- orbiting candle with a spherical flame -->
  <circle class="l3" cx="300" cy="104" r="78" style="fill:var(--surface)"/>
  <circle class="l3 thin" cx="300" cy="104" r="70"/>
  <line class="axis" x1="250" y1="168" x2="350" y2="168"/>
  <rect class="axis" x="284" y="112" width="32" height="56" style="fill:var(--surface)"/>
  <circle cx="300" cy="98" r="16" fill="#4a86e8" fill-opacity="0.35"/>
  <circle cx="300" cy="98" r="11" fill="#4a86e8" fill-opacity="0.7"/>
  <line class="axis" x1="300" y1="112" x2="300" y2="100"/>
  <text x="300" y="196" text-anchor="middle">in orbit</text>
</svg>
