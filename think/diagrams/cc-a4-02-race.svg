<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <!-- two identical slopes (32 degrees); each ball touches its slope at the same distance from the top -->
  <line class="axis" x1="6" y1="170" x2="394" y2="170"/>
  <path class="area" d="M20 70 V170 H180 Z"/><path class="axis" d="M20 70 V170 H180 Z"/>
  <path class="area" d="M220 70 V170 H380 Z"/><path class="axis" d="M220 70 V170 H380 Z"/>
  <!-- two balls that look identical from the outside -->
  <circle class="f3" cx="52.8" cy="74" r="14"/>
  <circle class="f3" cx="252.8" cy="74" r="14"/>
  <text x="53" y="48" text-anchor="middle">ball 1</text>
  <text x="253" y="48" text-anchor="middle">ball 2</text>
</svg>
