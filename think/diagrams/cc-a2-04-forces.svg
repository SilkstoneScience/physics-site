<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <!-- top: the balance between the two pulleys, pulled 10 N each way. bottom: the same balance hung from a hook with one weight. Both read 10 N. -->
  <text x="200" y="24" text-anchor="middle">between two weights</text>
  <rect class="axis" x="140" y="38" width="120" height="24" rx="4" style="fill:var(--surface)"/>
  <rect class="area" x="162" y="43" width="76" height="14"/><rect class="axis thin" x="162" y="43" width="76" height="14" style="fill:none"/>
  <text x="200" y="55" text-anchor="middle" style="font-size:13px">10 N</text>
  <line class="l2" x1="140" y1="50" x2="80" y2="50" marker-end="url(#ah2)"/>
  <text class="t2" x="70" y="56" text-anchor="end">10 N</text>
  <line class="l2" x1="260" y1="50" x2="320" y2="50" marker-end="url(#ah2)"/>
  <text class="t2" x="330" y="56">10 N</text>
  <text x="200" y="110" text-anchor="middle">hanging from a hook</text>
  <path class="l3" d="M60 128 H110 M64 128 V134 Q64 140 70 140 H76" style="fill:none"/>
  <path class="axis thin" d="M76 140 H140 M260 140 H300" style="fill:none"/>
  <rect class="axis" x="140" y="128" width="120" height="24" rx="4" style="fill:var(--surface)"/>
  <rect class="area" x="162" y="133" width="76" height="14"/><rect class="axis thin" x="162" y="133" width="76" height="14" style="fill:none"/>
  <text x="200" y="145" text-anchor="middle" style="font-size:13px">10 N</text>
  <rect class="area" x="300" y="130" width="22" height="22" rx="2"/><rect class="axis" x="300" y="130" width="22" height="22" rx="2"/>
  <line class="l2" x1="140" y1="168" x2="84" y2="168" marker-end="url(#ah2)"/>
  <text class="t2" x="110" y="192" text-anchor="middle">hook pulls 10 N</text>
  <line class="l2" x1="260" y1="168" x2="316" y2="168" marker-end="url(#ah2)"/>
  <text class="t2" x="290" y="192" text-anchor="middle">weight pulls 10 N</text>
</svg>
