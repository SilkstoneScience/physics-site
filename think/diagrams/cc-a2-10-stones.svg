<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210">
  <!-- a heavy stone and a light stone joined by a short cord, just released inside an evacuated bell jar; no arrows -->
  <!-- bell jar on a base plate, with a pipe to the vacuum pump -->
  <path class="axis" d="M128 186 V66 Q128 18 200 18 Q272 18 272 66 V186" style="fill:var(--surface)"/>
  <rect class="axis" x="192" y="8" width="16" height="10" rx="2" style="fill:var(--surface)"/>
  <path class="grid" d="M140 120 V70 Q140 40 166 32" style="stroke-width:3;fill:none"/>
  <rect class="axis" x="106" y="186" width="188" height="10" style="fill:var(--surface)"/>
  <path class="axis" d="M294 188 H322 M294 194 H322"/>
  <!-- heavy stone -->
  <path class="axis" d="M144 84 C140 64 152 50 170 48 C182 46 190 52 200 50 C212 50 216 64 212 78 C210 92 204 104 186 106 C168 110 148 104 144 84 Z" style="fill:var(--border)"/>
  <!-- cord tied between them -->
  <path class="l3 thin" d="M211 86 Q220 95 229 92"/>
  <!-- light stone -->
  <path class="axis" d="M229 92 C228 84 234 80 240 81 C246 80 251 85 250 92 C249 99 244 101 238 100 C232 100 229 97 229 92 Z" style="fill:var(--border)"/>
  <!-- labels -->
  <text x="100" y="84" text-anchor="end">heavy</text>
  <line class="axis" x1="104" y1="80" x2="150" y2="78" style="stroke-width:1"/>
  <text x="304" y="70">light</text>
  <line class="axis" x1="300" y1="66" x2="248" y2="86" style="stroke-width:1"/>
  <text x="220" y="122" text-anchor="middle" style="font-size:14px">cord</text>
  <text x="200" y="166" text-anchor="middle" style="font-size:14px">vacuum</text>
  <text x="326" y="196">to pump</text>
</svg>
