<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <!-- a heavy stone and a light stone joined by a short cord, in the air above the ground; no arrows -->
  <line class="axis" x1="0" y1="176" x2="400" y2="176"/>
  <path class="l3 thin" d="M30 176 l-6 10 M90 176 l-6 10 M150 176 l-6 10 M210 176 l-6 10 M270 176 l-6 10 M330 176 l-6 10 M390 176 l-6 10"/>
  <!-- heavy stone -->
  <path class="axis" d="M120 62 L160 46 L202 58 L214 92 L196 124 L150 130 L116 108 L108 80 Z" style="fill:var(--surface)"/>
  <!-- cord -->
  <line class="l3 thin" x1="212" y1="84" x2="248" y2="92"/>
  <!-- light stone -->
  <path class="axis" d="M248 84 L264 80 L276 90 L272 104 L256 108 L246 98 Z" style="fill:var(--surface)"/>
  <text x="98" y="104" text-anchor="end">heavy</text>
  <text x="286" y="112">light</text>
  <text x="230" y="76" text-anchor="middle" style="font-size:14px">cord</text>
  <text x="392" y="166" text-anchor="end" style="font-size:14px">ground</text>
</svg>
