<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <!-- three lamps in series with a battery; a wire joins the two sides of lamp 2 -->
  <path class="axis" d="M190 160 H40 V40 H90 M110 40 H190 M210 40 H290 M310 40 H360 V160 H210"/>
  <circle class="axis" cx="100" cy="40" r="10" style="fill:var(--surface)"/><line class="axis" x1="92.93" y1="32.93" x2="107.07" y2="47.07"/><line class="axis" x1="92.93" y1="47.07" x2="107.07" y2="32.93"/>
  <circle class="axis" cx="200" cy="40" r="10" style="fill:var(--surface)"/><line class="axis" x1="192.93" y1="32.93" x2="207.07" y2="47.07"/><line class="axis" x1="192.93" y1="47.07" x2="207.07" y2="32.93"/>
  <circle class="axis" cx="300" cy="40" r="10" style="fill:var(--surface)"/><line class="axis" x1="292.93" y1="32.93" x2="307.07" y2="47.07"/><line class="axis" x1="292.93" y1="47.07" x2="307.07" y2="32.93"/>
  <text x="100" y="22" text-anchor="middle">1</text><text x="200" y="22" text-anchor="middle">2</text><text x="300" y="22" text-anchor="middle">3</text>
  <!-- the added wire -->
  <path class="l1" d="M170 40 V84 H230 V40"/>
  <text class="t1" x="200" y="106" text-anchor="middle">wire added</text>
  <!-- battery -->
  <line class="axis" x1="190" y1="146" x2="190" y2="174"/><line class="axis" style="stroke-width:4" x1="200" y1="153" x2="200" y2="167"/>
  <text x="181" y="144" text-anchor="middle">+</text>
</svg>
