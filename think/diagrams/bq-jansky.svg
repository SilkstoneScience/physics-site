<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <!-- the Milky Way: a faint diagonal band of the text colour at low opacity -->
  <path class="f3" d="M0 95 C 80 60, 160 30, 260 22 C 320 18, 370 10, 400 0 L400 40 C 360 50, 300 55, 240 62 C 160 72, 80 110, 0 130 Z" style="opacity:0.12"/>
  <!-- stars -->
  <circle class="f3" cx="30" cy="30" r="1.2"/>
  <circle class="f3" cx="70" cy="18" r="1"/>
  <circle class="f3" cx="110" cy="40" r="1.4"/>
  <circle class="f3" cx="150" cy="14" r="1"/>
  <circle class="f3" cx="190" cy="52" r="1.2"/>
  <circle class="f3" cx="230" cy="30" r="1.6"/>
  <circle class="f3" cx="270" cy="60" r="1"/>
  <circle class="f3" cx="300" cy="24" r="1.3"/>
  <circle class="f3" cx="340" cy="46" r="1.1"/>
  <circle class="f3" cx="375" cy="70" r="1.4"/>
  <circle class="f3" cx="55" cy="70" r="1"/>
  <circle class="f3" cx="350" cy="90" r="1"/>
  <circle class="f3" cx="20" cy="110" r="1.2"/>
  <text x="330" y="60" text-anchor="middle" style="font-size:13px">Milky Way</text>
  <!-- ground and the circular track the antenna turned on, seen from the side -->
  <line class="axis" x1="0" y1="172" x2="400" y2="172"/>
  <ellipse class="axis thin" cx="200" cy="168" rx="125" ry="7" style="fill:none"/>
  <!-- the antenna: a long rectangular frame of poles and wires on a wooden chassis with four wheels -->
  <rect class="axis" x="88" y="140" width="224" height="8" style="fill:var(--surface)"/>
  <circle class="axis" cx="108" cy="156" r="7" style="fill:var(--surface)"/>
  <circle class="axis" cx="150" cy="156" r="7" style="fill:var(--surface)"/>
  <circle class="axis" cx="250" cy="156" r="7" style="fill:var(--surface)"/>
  <circle class="axis" cx="292" cy="156" r="7" style="fill:var(--surface)"/>
  <!-- the frame: a top rail, a bottom rail and vertical poles -->
  <line class="axis" x1="96" y1="90" x2="304" y2="90"/>
  <line class="axis" x1="96" y1="140" x2="304" y2="140"/>
  <line class="axis" x1="96" y1="90" x2="96" y2="140"/>
  <line class="axis" x1="122" y1="90" x2="122" y2="140"/>
  <line class="axis" x1="148" y1="90" x2="148" y2="140"/>
  <line class="axis" x1="174" y1="90" x2="174" y2="140"/>
  <line class="axis" x1="200" y1="90" x2="200" y2="140"/>
  <line class="axis" x1="226" y1="90" x2="226" y2="140"/>
  <line class="axis" x1="252" y1="90" x2="252" y2="140"/>
  <line class="axis" x1="278" y1="90" x2="278" y2="140"/>
  <line class="axis" x1="304" y1="90" x2="304" y2="140"/>
  <!-- the aerial wires strung between the poles -->
  <line class="l1 thin" x1="96" y1="100" x2="304" y2="100"/>
  <line class="l1 thin" x1="96" y1="112" x2="304" y2="112"/>
  <line class="l1 thin" x1="96" y1="124" x2="304" y2="124"/>
  <!-- a curved arrow showing that the whole frame rotates slowly on its track -->
  <path class="l2 thin" d="M330 150 q 30 10 -10 24" style="fill:none" marker-end="url(#ah2)"/>
  <text class="t2" x="356" y="146" text-anchor="middle" style="font-size:13px">turns</text>
  <text x="200" y="192" text-anchor="middle" style="font-size:13px">rotating aerial on four wheels</text>
</svg>
