<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210">
  <!-- a loudspeaker lying on its back so the cone faces upwards, seen in section; an ant stands on the cone -->
  <!-- bench -->
  <line class="axis" x1="40" y1="196" x2="360" y2="196"/>
  <!-- magnet and frame below the cone -->
  <rect class="axis" x="160" y="160" width="80" height="36" style="fill:var(--surface)"/>
  <rect class="axis thin" x="184" y="140" width="32" height="20" style="fill:var(--surface)"/>
  <!-- cone (section): a shallow V opening upwards, with a rim -->
  <path class="axis" d="M90 112 L200 142 L310 112" style="fill:var(--surface)"/>
  <path class="axis" d="M90 112 L96 104 M310 112 L304 104"/>
  <!-- cone's rim frame -->
  <line class="axis thin" x1="78" y1="112" x2="90" y2="112"/>
  <line class="axis thin" x1="310" y1="112" x2="322" y2="112"/>
  <!-- ant standing on the cone, left of centre: three body segments, six legs, two antennae -->
  <ellipse class="f3" cx="150" cy="118" rx="7" ry="5"/>
  <ellipse class="f3" cx="162" cy="120" rx="5" ry="4"/>
  <ellipse class="f3" cx="172" cy="123" rx="4" ry="3.5"/>
  <path class="axis thin" d="M158 122 L150 132 M163 123 L160 134 M166 123 L170 134 M158 118 L148 128 M164 119 L164 130"/>
  <path class="axis thin" d="M174 121 L180 114 M176 124 L184 120"/>
  <!-- double-headed arrow at the side: the cone moves up and down (no size given) -->
  <line class="l1" x1="350" y1="96" x2="350" y2="132"/>
  <path class="f1" d="M350 86 L344 98 L356 98 Z M350 142 L344 130 L356 130 Z"/>
  <!-- labels -->
  <text x="160" y="92" text-anchor="middle">ant on the cone</text>
  <text x="200" y="60" text-anchor="middle">cone moves up and down</text>
  <text x="300" y="186" text-anchor="middle">loudspeaker</text>
</svg>
