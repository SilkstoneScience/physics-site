<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 230">
  <!-- a fixed height scale beside the falling rod -->
  <line class="axis" x1="40" y1="15" x2="40" y2="215"/>
  <line class="axis thin" x1="32" y1="15" x2="40" y2="15"/>
  <line class="axis thin" x1="32" y1="35" x2="40" y2="35"/>
  <line class="axis thin" x1="32" y1="55" x2="40" y2="55"/>
  <line class="axis thin" x1="32" y1="75" x2="40" y2="75"/>
  <line class="axis thin" x1="32" y1="95" x2="40" y2="95"/>
  <line class="axis thin" x1="32" y1="115" x2="40" y2="115"/>
  <line class="axis thin" x1="32" y1="135" x2="40" y2="135"/>
  <line class="axis thin" x1="32" y1="155" x2="40" y2="155"/>
  <line class="axis thin" x1="32" y1="175" x2="40" y2="175"/>
  <line class="axis thin" x1="32" y1="195" x2="40" y2="195"/>
  <line class="axis thin" x1="32" y1="215" x2="40" y2="215"/>
  <text x="48" y="20">fixed scale</text>
  <!-- loudspeaker: box with a cone opening downwards -->
  <rect class="axis" x="200" y="30" width="40" height="26" style="fill:var(--surface)"/>
  <polygon class="axis" points="205,56 235,56 245,74 195,74" style="fill:var(--surface)"/>
  <text x="256" y="48">loudspeaker</text>
  <text x="256" y="68">1000 Hz</text>
  <!-- rigid rod -->
  <line class="l3" x1="220" y1="74" x2="220" y2="186"/>
  <!-- microphone -->
  <circle class="axis" cx="220" cy="194" r="8" style="fill:var(--surface)"/>
  <line class="axis thin" x1="214" y1="191" x2="226" y2="191"/>
  <line class="axis thin" x1="214" y1="197" x2="226" y2="197"/>
  <text x="256" y="199">microphone</text>
  <!-- separation -->
  <line class="l3 thin" x1="176" y1="74" x2="176" y2="194" marker-start="url(#ah3)" marker-end="url(#ah3)"/>
  <text x="168" y="139" text-anchor="end">2 m</text>
  <!-- falling -->
  <text x="330" y="100" text-anchor="middle">falls freely</text>
  <line class="axis" x1="330" y1="108" x2="330" y2="160" marker-end="url(#ah3)"/>
</svg>
