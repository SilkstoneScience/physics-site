<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <!-- free-body diagrams: left, the ball on the way up; right, on the way down. W is the same in both; drag is shorter on the way down because the ball is slower. The small grey arrow shows the direction of motion. -->
  <text x="100" y="26" text-anchor="middle">going up</text>
  <circle class="l3" cx="100" cy="76" r="12" style="fill:var(--surface)"/>
  <line class="l3 thin" x1="60" y1="84" x2="60" y2="66" marker-end="url(#ah3)"/>
  <line class="l1" x1="90" y1="90" x2="90" y2="150" marker-end="url(#ah1)"/>
  <text class="t1" x="84" y="172" text-anchor="end">W</text>
  <line class="l2" x1="112" y1="90" x2="112" y2="132" marker-end="url(#ah2)"/>
  <text class="t2" x="120" y="150">drag</text>
  <text x="290" y="26" text-anchor="middle">coming down</text>
  <circle class="l3" cx="290" cy="96" r="12" style="fill:var(--surface)"/>
  <line class="l3 thin" x1="250" y1="88" x2="250" y2="106" marker-end="url(#ah3)"/>
  <line class="l1" x1="290" y1="110" x2="290" y2="170" marker-end="url(#ah1)"/>
  <text class="t1" x="300" y="176">W</text>
  <line class="l2" x1="290" y1="82" x2="290" y2="50" marker-end="url(#ah2)"/>
  <text class="t2" x="300" y="56">drag</text>
</svg>
