  <line class="l3 thin" x1="170" y1="26" x2="200" y2="150"/>
  <line class="grid dash" x1="170" y1="26" x2="170" y2="160"/>
  <circle class="f3" cx="202" cy="158" r="9"/>
  <!-- the length l -->
  <line class="l1 thin" x1="132" y1="28" x2="132" y2="156" marker-start="url(#ah1)" marker-end="url(#ah1)"/>
  <text class="t1" x="124" y="96" text-anchor="end"><tspan style="font-style:italic">l</tspan></text>
  <text x="124" y="116" text-anchor="end" style="font-size:13px">(precise)</text>
  <!-- the period -->
