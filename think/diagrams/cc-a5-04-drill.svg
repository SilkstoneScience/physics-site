<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 230">
  <!-- top: the drill's frame (plank flies in, length-contracted). bottom: the plank's frame (drill flies in, length-contracted). 6 px per cm. -->
  <text x="10" y="26">Drill's frame</text>
  <rect class="axis" x="40" y="44" width="70" height="28" rx="4" style="fill:var(--surface)"/>
  <rect class="axis" x="52" y="72" width="22" height="28" rx="3" style="fill:var(--surface)"/>
  <rect class="f3" x="110" y="52" width="12" height="12"/>
  <line class="l3" x1="122" y1="58" x2="182" y2="58"/>
  <text x="152" y="48" text-anchor="middle" style="font-size:14px">10 cm</text>
  <rect class="area" x="250" y="30" width="52" height="70"/><rect class="axis" x="250" y="30" width="52" height="70"/>
  <text x="276" y="22" text-anchor="middle" style="font-size:14px">8.7 cm</text>
  <line class="l1" x1="354" y1="65" x2="310" y2="65" marker-end="url(#ah1)"/>
  <text class="t1" x="358" y="70">0.9c</text>
  <line class="grid" x1="0" y1="115" x2="400" y2="115"/>
  <text x="10" y="136">Plank's frame</text>
  <text class="t1" x="88" y="173" text-anchor="end">0.9c</text>
  <line class="l1" x1="96" y1="168" x2="142" y2="168" marker-end="url(#ah1)"/>
  <rect class="axis" x="150" y="154" width="31" height="28" rx="3" style="fill:var(--surface)"/>
  <rect class="axis" x="155" y="182" width="10" height="26" rx="2" style="fill:var(--surface)"/>
  <rect class="f3" x="181" y="162" width="5" height="12"/>
  <line class="l3" x1="186" y1="168" x2="212" y2="168"/>
  <text x="199" y="152" text-anchor="middle" style="font-size:14px">4.4 cm</text>
  <rect class="area" x="250" y="140" width="120" height="70"/><rect class="axis" x="250" y="140" width="120" height="70"/>
  <text x="310" y="132" text-anchor="middle" style="font-size:14px">20 cm</text>
</svg>
