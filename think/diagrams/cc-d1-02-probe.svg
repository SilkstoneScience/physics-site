<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220">
  <!-- the Sun and part of the probe's circular orbit -->
  <circle class="area" cx="80" cy="110" r="32"/><circle class="axis" cx="80" cy="110" r="32"/>
  <text x="80" y="168" text-anchor="middle">Sun</text>
  <path class="axis dash" d="M253.2 10 A200 200 0 0 1 253.2 210"/>
  <!-- the probe: a body with two solar panels -->
  <line class="l3 thin" x1="280" y1="96" x2="280" y2="124"/>
  <rect class="axis" x="273" y="90" width="14" height="6" style="fill:var(--surface)"/>
  <rect class="axis" x="273" y="124" width="14" height="6" style="fill:var(--surface)"/>
  <rect class="axis" x="273" y="103" width="14" height="14" rx="2" style="fill:var(--surface)"/>
  <!-- its velocity -->
  <line class="l1" x1="304" y1="128" x2="304" y2="76" marker-end="url(#ah1)"/>
  <text class="t1" x="312" y="108">30 km s⁻¹</text>
  <text x="266" y="150" text-anchor="end">probe</text>
  <text x="246" y="196" text-anchor="end">orbit</text>
</svg>
