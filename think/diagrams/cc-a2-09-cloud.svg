<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220">
  <!-- a cumulus cloud with a flat base over a field; a zoom circle shows the droplets inside it (not to scale); no arrows -->
  <!-- field -->
  <line class="axis" x1="0" y1="190" x2="400" y2="190"/>
  <path class="l3 thin" d="M20 190 l3 -8 M26 190 l-2 -7 M70 190 l3 -8 M76 190 l-2 -7 M130 190 l3 -8 M136 190 l-2 -7 M190 190 l3 -8 M196 190 l-2 -7 M250 190 l3 -8 M256 190 l-2 -7 M320 190 l3 -8 M326 190 l-2 -7 M370 190 l3 -8 M376 190 l-2 -7"/>
  <!-- cloud: bumpy top, flat base -->
  <path class="axis" d="M40 112 H230 A22 22 0 0 0 226 70 A26 26 0 0 0 184 48 A30 30 0 0 0 128 44 A26 26 0 0 0 82 60 A26 26 0 0 0 40 84 A15 15 0 0 0 40 112 Z" style="fill:var(--surface)"/>
  <text x="135" y="134" text-anchor="middle" style="font-size:14px">flat base</text>
  <!-- zoom lines and circle -->
  <circle class="l3 thin dash" cx="176" cy="86" r="12"/>
  <line class="l3 thin dash" x1="176" y1="74" x2="290" y2="58"/>
  <line class="l3 thin dash" x1="176" y1="98" x2="290" y2="122"/>
  <circle class="axis" cx="322" cy="90" r="44" style="fill:var(--surface)"/>
  <circle class="f1" cx="300" cy="76" r="2.5"/><circle class="f1" cx="318" cy="64" r="2.5"/><circle class="f1" cx="338" cy="72" r="2.5"/>
  <circle class="f1" cx="306" cy="98" r="2.5"/><circle class="f1" cx="326" cy="88" r="2.5"/><circle class="f1" cx="346" cy="96" r="2.5"/>
  <circle class="f1" cx="314" cy="114" r="2.5"/><circle class="f1" cx="334" cy="110" r="2.5"/><circle class="f1" cx="296" cy="112" r="2.5"/>
  <circle class="f1" cx="352" cy="82" r="2.5"/><circle class="f1" cx="330" cy="100" r="2.5"/>
  <text class="t1" x="322" y="158" text-anchor="middle">water droplets</text>
  <text x="390" y="212" text-anchor="end" style="font-size:14px">field</text>
</svg>
