<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210">
  <line class="grid" x1="200" y1="8" x2="200" y2="196"/>
  <rect class="area" x="6" y="170" width="188" height="10"/><line class="axis" x1="6" y1="170" x2="194" y2="170"/>
  <rect class="area" x="206" y="170" width="188" height="10"/><line class="axis" x1="206" y1="170" x2="394" y2="170"/>
  <!-- clear night: the ground's infrared escapes to space -->
  <g class="l1" marker-end="url(#ah1)">
    <line x1="40" y1="166" x2="30" y2="62"/><line x1="96" y1="166" x2="96" y2="62"/><line x1="152" y1="166" x2="162" y2="62"/>
  </g>
  <text class="t1" x="100" y="40" text-anchor="middle">to space</text>
  <!-- cloudy night: clouds absorb most of it and send some back down -->
  <path class="axis" d="M216 92 A16 16 0 0 1 240 70 A22 22 0 0 1 282 60 A18 18 0 0 1 316 70 A20 20 0 0 1 352 66 A16 16 0 0 1 384 92 Z" style="fill:var(--surface)"/>
  <path class="area" d="M216 92 A16 16 0 0 1 240 70 A22 22 0 0 1 282 60 A18 18 0 0 1 316 70 A20 20 0 0 1 352 66 A16 16 0 0 1 384 92 Z"/>
  <path class="axis" d="M216 92 A16 16 0 0 1 240 70 A22 22 0 0 1 282 60 A18 18 0 0 1 316 70 A20 20 0 0 1 352 66 A16 16 0 0 1 384 92 Z"/>
  <g class="l1" marker-end="url(#ah1)">
    <line x1="236" y1="166" x2="236" y2="102"/><line x1="300" y1="166" x2="300" y2="102"/><line x1="364" y1="166" x2="364" y2="102"/>
  </g>
  <g class="l1 thin dash" marker-end="url(#ah1)">
    <line x1="266" y1="98" x2="266" y2="160"/><line x1="334" y1="98" x2="334" y2="160"/>
  </g>
  <line class="l1 thin dash" x1="300" y1="54" x2="300" y2="22" marker-end="url(#ah1)"/>
  <text x="100" y="200" text-anchor="middle">clear night</text>
  <text x="300" y="200" text-anchor="middle">cloudy night</text>
</svg>
