<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220">
  <!-- hob and gas flames below the pot: the flame is a real colour, so it is hard-coded -->
  <rect class="axis" x="60" y="188" width="280" height="10" style="fill:var(--surface)"/>
  <path d="M130 188 q-6 -14 6 -24 q-2 10 8 12 q4 -10 10 -16 q0 14 10 18 q6 -8 4 -16 q10 10 6 26 Z" style="fill:#f28c28;stroke:none"/>
  <path d="M180 188 q-6 -14 6 -24 q-2 10 8 12 q4 -10 10 -16 q0 14 10 18 q6 -8 4 -16 q10 10 6 26 Z" style="fill:#f28c28;stroke:none"/>
  <path d="M230 188 q-6 -14 6 -24 q-2 10 8 12 q4 -10 10 -16 q0 14 10 18 q6 -8 4 -16 q10 10 6 26 Z" style="fill:#f28c28;stroke:none"/>
  <path d="M146 188 q-2 -8 4 -12 q2 6 6 8 Z M196 188 q-2 -8 4 -12 q2 6 6 8 Z M246 188 q-2 -8 4 -12 q2 6 6 8 Z" style="fill:#f9c74f;stroke:none"/>
  <!-- large pot on a trivet above the flames -->
  <line class="axis" x1="110" y1="162" x2="290" y2="162"/>
  <path class="axis" d="M90 40 V160 H310 V40" style="fill:var(--surface)"/>
  <rect class="area" x="92" y="58" width="216" height="101"/>
  <line class="axis" x1="90" y1="40" x2="310" y2="40"/>
  <path class="axis" d="M90 50 H70 M310 50 H330"/>
  <!-- bubbles in the outer water only -->
  <circle class="l1 thin" cx="110" cy="130" r="4"/><circle class="l1 thin" cx="124" cy="100" r="3"/><circle class="l1 thin" cx="104" cy="78" r="3"/>
  <circle class="l1 thin" cx="290" cy="136" r="4"/><circle class="l1 thin" cx="278" cy="108" r="3"/><circle class="l1 thin" cx="296" cy="80" r="3"/>
  <circle class="l1 thin" cx="150" cy="150" r="3"/><circle class="l1 thin" cx="250" cy="148" r="3"/>
  <path class="l1 thin" d="M100 60 q10 -4 20 0 t20 0 M260 60 q10 -4 20 0 t20 0"/>
  <!-- small pot sitting inside -->
  <path class="axis" d="M150 70 V140 H250 V70" style="fill:var(--surface)"/>
  <rect class="area" x="152" y="90" width="96" height="49"/>
  <line class="axis" x1="150" y1="70" x2="250" y2="70"/>
  <path class="axis" d="M150 80 H138 M250 80 H262"/>
  <!-- labels -->
  <text x="200" y="24" text-anchor="middle">inner pot: hot, no bubbles</text>
  <text x="200" y="214" text-anchor="middle">outer water boiling hard</text>
</svg>
