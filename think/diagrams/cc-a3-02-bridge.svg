  <line class="l1" x1="150" y1="80" x2="211.3" y2="28.6" marker-end="url(#ah1)"/>
  <line class="l1" x1="150" y1="80" x2="230" y2="80" marker-end="url(#ah1)"/>
  <line class="l1" x1="150" y1="80" x2="211.3" y2="131.4" marker-end="url(#ah1)"/>
  <path class="l3 thin" d="M190 80 A40 40 0 0 0 180.6 54.3 M190 80 A40 40 0 0 1 180.6 105.7"/>
