<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <!-- horizontal forces on team A: the rope's tension pulls them towards team B (blue); friction from the ground pushes them the other way (orange). Vertical forces are left out. -->
  <line class="axis" x1="0" y1="160" x2="400" y2="160"/>
  <line class="axis" x1="126" y1="100" x2="330" y2="100" style="stroke-width:2.5"/>
  <text x="392" y="92" text-anchor="end">to team B</text>
  <!-- one figure standing for the whole team, leaning left -->
  <circle class="axis" cx="90" cy="80" r="8" style="fill:var(--surface)"/><path class="axis" d="M94 88 L108 126 L116 160 M108 126 L124 160 M100 94 L126 100"/>
  <!-- tension on the team, along the rope -->
  <line class="l1" x1="160" y1="80" x2="240" y2="80" marker-end="url(#ah1)"/>
  <text class="t1" x="200" y="68" text-anchor="middle">tension T</text>
  <!-- friction on the feet, along the ground -->
  <line class="l2" x1="116" y1="148" x2="36" y2="148" marker-end="url(#ah2)"/>
  <text class="t2" x="76" y="138" text-anchor="middle">friction</text>
  <text x="392" y="188" text-anchor="end">ground</text>
</svg>
