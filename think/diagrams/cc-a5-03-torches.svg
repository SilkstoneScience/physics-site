<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 186">
  <!-- a person at rest holding two torches that shine in opposite directions -->
  <path class="area" d="M152 80 L10 50 V110 Z"/>
  <path class="area" d="M248 80 L390 50 V110 Z"/>
  <line class="l2 thin dash" x1="146" y1="80" x2="16" y2="80"/>
  <line class="l2 thin dash" x1="254" y1="80" x2="384" y2="80"/>
  <text class="t2" x="70" y="38" text-anchor="middle">light</text>
  <text class="t2" x="330" y="38" text-anchor="middle">light</text>
  <!-- torches -->
  <rect class="axis" x="152" y="73" width="22" height="14" rx="2" style="fill:var(--surface)"/>
  <rect class="axis" x="226" y="73" width="22" height="14" rx="2" style="fill:var(--surface)"/>
  <!-- the person -->
  <line class="grid" x1="0" y1="160" x2="400" y2="160"/>
  <circle class="l3 thin" cx="200" cy="60" r="9" style="fill:var(--surface)"/>
  <path class="l3 thin" d="M200 69 V118 M200 84 L174 80 M200 84 L226 80 M200 118 L188 160 M200 118 L212 160"/>
  <text x="200" y="178" text-anchor="middle">you, standing still</text>
</svg>
