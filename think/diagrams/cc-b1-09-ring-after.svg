<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <!-- the washer before heating (dashed) and after heating (solid), seen from above; the expansion is hugely exaggerated -->
  <!-- after: larger ring, every distance scaled up by the same factor -->
  <circle class="l2" cx="200" cy="100" r="78" style="fill:var(--surface)"/>
  <circle class="l2" cx="200" cy="100" r="34" style="fill:var(--surface)"/>
  <!-- before: dashed outlines, same centre -->
  <circle class="l1 dash" cx="200" cy="100" r="68"/>
  <circle class="l1 dash" cx="200" cy="100" r="30"/>
  <!-- labels -->
  <text class="t1" x="20" y="32">cold</text>
  <text class="t2" x="20" y="176">hot</text>
  <text x="200" y="104" text-anchor="middle">hole</text>
  <line class="l1 thin" x1="52" y1="38" x2="132" y2="100"/>
  <line class="l2 thin" x1="52" y1="170" x2="124" y2="118"/>
</svg>
