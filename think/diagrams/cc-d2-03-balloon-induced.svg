<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <!-- painted wall (section seen from the side) -->
  <rect class="area" x="300" y="0" width="100" height="200"/>
  <line class="axis" x1="300" y1="0" x2="300" y2="200"/>
  <!-- induced charges: positive on the near surface, negative further in -->
  <text class="t1" x="311" y="56" text-anchor="middle">+</text>
  <text class="t1" x="311" y="80" text-anchor="middle">+</text>
  <text class="t1" x="311" y="104" text-anchor="middle">+</text>
  <text class="t1" x="311" y="128" text-anchor="middle">+</text>
  <text class="t2" x="372" y="56" text-anchor="middle">−</text>
  <text class="t2" x="372" y="80" text-anchor="middle">−</text>
  <text class="t2" x="372" y="104" text-anchor="middle">−</text>
  <text class="t2" x="372" y="128" text-anchor="middle">−</text>
  <text x="350" y="24" text-anchor="middle" style="font-size:14px">wall</text>
  <text class="t1" x="311" y="166" text-anchor="middle" style="font-size:14px">near</text>
  <text class="t2" x="372" y="166" text-anchor="middle" style="font-size:14px">far</text>
  <!-- the charged balloon -->
  <ellipse class="l1" cx="262" cy="90" rx="38" ry="48" style="fill:var(--surface)"/>
  <path class="f1" d="M256 145 L262 137 L268 145 Z"/>
  <path class="l3 thin" d="M262 145 C250 160 240 170 228 192"/>
  <text x="274" y="72" text-anchor="middle">−</text>
  <text x="284" y="98" text-anchor="middle">−</text>
  <text x="272" y="122" text-anchor="middle">−</text>
  <text x="256" y="96" text-anchor="middle">−</text>
  <text x="200" y="100" text-anchor="end">balloon</text>
</svg>
