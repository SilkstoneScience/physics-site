<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <!-- after the throw: the pack flies left (orange momentum arrow), the person slides right towards the shore (blue momentum arrow, the same length) -->
  <rect class="area" x="0" y="130" width="400" height="70"/>
  <line class="axis" x1="0" y1="130" x2="400" y2="130"/>
  <!-- distant shore: bank and trees -->
  <path class="axis" d="M330 130 L344 120 H400" style="fill:var(--surface)"/>
  <path class="axis" d="M352 120 L360 98 L368 120 Z M372 120 L380 94 L388 120 Z M392 120 L398 102 L400 106 V120 Z" style="fill:var(--surface)"/>
  <text x="396" y="146" text-anchor="end" style="font-size:14px">shore</text>
  <!-- the pack in flight -->
  <rect class="axis" x="72" y="76" width="14" height="22" rx="3" style="fill:var(--surface)"/>
  <line class="l2" x1="66" y1="87" x2="16" y2="87" marker-end="url(#ah2)"/>
  <text class="t2" x="79" y="64" text-anchor="middle" style="font-size:14px">pack, fast</text>
  <!-- the person sliding right, leaning slightly -->
  <circle class="axis" cx="188" cy="70" r="8" style="fill:var(--surface)"/>
  <path class="axis" d="M188 78 L192 108 M190 86 L176 96 M190 86 L204 100 M192 108 L184 130 M192 108 L200 130"/>
  <line class="l1" x1="210" y1="87" x2="260" y2="87" marker-end="url(#ah1)"/>
  <text class="t1" x="235" y="64" text-anchor="middle" style="font-size:14px">you, slowly</text>
  <text x="200" y="186" text-anchor="middle">equal and opposite momentum</text>
</svg>
