<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 196">
  <!-- kinetic energy of each ball on the level ground, as bars to scale: translational 1/2 mv^2 is the same for both (150 units); rotational is 0.4 of it for the solid ball (60) and 2/3 of it for the hollow ball (100). Heights for v = 3.0 m/s, g = 9.8 -->
  <text class="t1" x="155" y="34" text-anchor="middle" style="font-size:14px">moving along</text>
  <text class="t2" x="280" y="34" text-anchor="middle" style="font-size:14px">spinning</text>
  <text x="70" y="61" text-anchor="end">solid</text>
  <rect class="f1" x="80" y="42" width="150" height="26"/>
  <rect class="f2" x="230" y="42" width="60" height="26"/>
  <text x="80" y="90" style="font-size:14px">enough to rise 0.64 m</text>
  <text x="70" y="141" text-anchor="end">hollow</text>
  <rect class="f1" x="80" y="122" width="150" height="26"/>
  <rect class="f2" x="230" y="122" width="100" height="26"/>
  <text x="80" y="170" style="font-size:14px">enough to rise 0.77 m</text>
</svg>
