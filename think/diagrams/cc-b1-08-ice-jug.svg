<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 230">
  <!-- an open insulated box (thick double wall) holding ice cubes; a jug of steaming hot water is tipped above it, pouring in -->
  <!-- insulated box: outer wall, inner wall -->
  <path class="axis" d="M110 96 V194 H330 V96" style="fill:var(--surface)"/>
  <path class="axis thin" d="M124 108 V182 H316 V108"/>
  <line class="axis" x1="110" y1="96" x2="124" y2="96"/>
  <line class="axis" x1="316" y1="96" x2="330" y2="96"/>
  <!-- ice cubes inside (pale blue, slightly tilted blocks) -->
  <rect class="area" x="138" y="150" width="34" height="30" rx="3"/>
  <rect class="l1 thin" x="138" y="150" width="34" height="30" rx="3"/>
  <rect class="area" x="178" y="154" width="34" height="26" rx="3"/>
  <rect class="l1 thin" x="178" y="154" width="34" height="26" rx="3"/>
  <rect class="area" x="226" y="152" width="36" height="28" rx="3"/>
  <rect class="l1 thin" x="226" y="152" width="36" height="28" rx="3"/>
  <rect class="area" x="268" y="156" width="32" height="24" rx="3"/>
  <rect class="l1 thin" x="268" y="156" width="32" height="24" rx="3"/>
  <rect class="area" x="158" y="124" width="34" height="28" rx="3"/>
  <rect class="l1 thin" x="158" y="124" width="34" height="28" rx="3"/>
  <rect class="area" x="242" y="126" width="34" height="28" rx="3"/>
  <rect class="l1 thin" x="242" y="126" width="34" height="28" rx="3"/>
  <!-- jug, tilted, above the box -->
  <path class="axis" d="M226 22 L262 14 L296 58 L262 84 Z" style="fill:var(--surface)"/>
  <path class="axis thin" d="M296 58 Q318 50 314 30 Q310 14 290 20"/>
  <!-- stream of water from the spout into the box -->
  <path class="l2" d="M228 24 Q218 60 214 104"/>
  <!-- steam from the jug -->
  <path class="l3 thin" d="M252 8 q6 -10 0 -18 M268 6 q6 -10 0 -18"/>
  <!-- labels -->
  <text x="20" y="44">1 kg water</text>
  <text x="20" y="64">at 100 °C</text>
  <text x="20" y="150">1 kg ice</text>
  <text x="20" y="170">at 0 °C</text>
  <text x="220" y="222" text-anchor="middle">insulated box</text>
</svg>
