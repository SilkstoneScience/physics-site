<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <!-- a dark room with a poker, a person and a block of ice. The background must really be dark, so its colour is fixed, and the outlines are fixed light grey so they show on it in both light and dark mode. Nothing shows any radiation. -->
  <rect x="0" y="0" width="400" height="200" fill="#161a2b"/>
  <line x1="0" y1="168" x2="400" y2="168" stroke="#c8ccd8" stroke-width="1.5"/>
  <!-- poker leaning against the left wall: a rod with a ring handle and a thicker tip -->
  <line x1="52" y1="166" x2="92" y2="58" stroke="#c8ccd8" stroke-width="2"/>
  <line x1="52" y1="166" x2="60" y2="144" stroke="#c8ccd8" stroke-width="5" stroke-linecap="round"/>
  <circle cx="94" cy="52" r="6" fill="none" stroke="#c8ccd8" stroke-width="2"/>
  <text x="72" y="190" text-anchor="middle" style="fill:#c8ccd8">poker</text>
  <!-- person -->
  <circle cx="200" cy="60" r="12" fill="#161a2b" stroke="#c8ccd8" stroke-width="2"/>
  <path d="M200 72 V122 M200 84 L178 110 M200 84 L222 110 M200 122 L188 168 M200 122 L212 168" fill="none" stroke="#c8ccd8" stroke-width="2"/>
  <text x="200" y="190" text-anchor="middle" style="fill:#c8ccd8">person</text>
  <!-- block of ice drawn as a cube -->
  <path d="M300 118 H350 V168 H300 Z M300 118 L318 102 H368 L350 118 M368 102 V152 L350 168" fill="none" stroke="#c8ccd8" stroke-width="2" stroke-linejoin="round"/>
  <text x="332" y="190" text-anchor="middle" style="fill:#c8ccd8">ice</text>
</svg>
