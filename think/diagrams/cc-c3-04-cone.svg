<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 230">
  <!-- water: a real colour so it reads as water in both themes -->
  <rect x="70" y="150" width="330" height="80" style="fill:#3a8fd9;fill-opacity:0.18"/>
  <line x1="70" y1="150" x2="400" y2="150" style="stroke:#3a8fd9;stroke-width:2"/>
  <!-- bank -->
  <polygon class="axis" points="0,140 70,140 92,230 0,230" style="fill:var(--surface)"/>
  <!-- angler -->
  <circle class="l3 thin" cx="60" cy="62" r="9" style="fill:var(--surface)"/>
  <line class="l3 thin" x1="60" y1="71" x2="60" y2="112"/>
  <polyline class="l3 thin" points="50,140 60,112 70,140"/>
  <polyline class="l3 thin" points="60,84 76,78"/>
  <!-- the 13 degree cone: normal (dashed) and the cone's edge -->
  <line class="axis thin dash" x1="60" y1="71" x2="60" y2="140"/>
  <line class="l2 thin dash" x1="60" y1="62" x2="81" y2="150"/>
  <text class="t2" x="84" y="140" style="font-size:14px">13°</text>
  <!-- sound within the cone: enters, bending away from the normal (10 degrees in air becomes 50 degrees in water) -->
  <line class="l2 thin" x1="60" y1="62" x2="76" y2="150"/>
  <line class="l2" x1="76" y1="150" x2="130" y2="195" marker-end="url(#ah2)"/>
  <text class="t2" x="138" y="206">enters</text>
  <!-- sound outside the cone: totally reflected at the surface -->
  <line class="l1 thin" x1="60" y1="62" x2="130" y2="150"/>
  <line class="l1" x1="130" y1="150" x2="200" y2="60" marker-end="url(#ah1)"/>
  <line class="l1 thin" x1="60" y1="62" x2="200" y2="150"/>
  <line class="l1" x1="200" y1="150" x2="284" y2="96" marker-end="url(#ah1)"/>
  <text class="t1" x="212" y="50">reflected</text>
  <!-- fish -->
  <path class="l3 thin" d="M290 205 q18 -12 36 0 q-18 12 -36 0 Z M326 205 l12 -8 v16 Z" style="fill:var(--surface)"/>
  <circle class="f3" cx="298" cy="203" r="1.5"/>
  <text x="346" y="210">fish</text>
</svg>
