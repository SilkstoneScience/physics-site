<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 230">
  <!-- water: a real colour so it reads as water in both themes -->
  <rect x="70" y="150" width="330" height="80" style="fill:#3a8fd9;fill-opacity:0.18"/>
  <line x1="70" y1="150" x2="400" y2="150" style="stroke:#3a8fd9;stroke-width:2"/>
  <!-- bank -->
  <polygon class="axis" points="0,140 70,140 92,230 0,230" style="fill:var(--surface)"/>
  <!-- angler at the edge of the bank, facing the water -->
  <circle class="l3 thin" cx="60" cy="62" r="9" style="fill:var(--surface)"/>
  <line class="l3 thin" x1="60" y1="71" x2="60" y2="112"/>
  <polyline class="l3 thin" points="50,140 60,112 70,140"/>
  <polyline class="l3 thin" points="60,84 76,78"/>
  <line class="l3 thin" x1="72" y1="86" x2="200" y2="22"/>
  <line class="l3 thin dash" x1="200" y1="22" x2="215" y2="150"/>
  <circle class="l3 thin" cx="215" cy="150" r="3" style="fill:var(--surface)"/>
  <!-- quiet speech marks -->
  <path class="l3 thin" d="M74 58 q4 4 0 8 M80 54 q7 8 0 16"/>
  <text x="8" y="24">talking quietly</text>
  <!-- fish a few metres out -->
  <path class="l3 thin" d="M290 205 q18 -12 36 0 q-18 12 -36 0 Z M326 205 l12 -8 v16 Z" style="fill:var(--surface)"/>
  <circle class="f3" cx="298" cy="203" r="1.5"/>
  <text x="346" y="210">fish</text>
</svg>
