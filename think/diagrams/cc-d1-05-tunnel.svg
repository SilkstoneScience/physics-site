<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 258">
  <!-- a cut-away Earth with a straight tunnel through its centre -->
  <circle class="area" cx="200" cy="132" r="95"/><circle class="axis" cx="200" cy="132" r="95"/>
  <rect x="194" y="37" width="12" height="190" style="fill:var(--surface)"/>
  <line class="axis" x1="194" y1="37" x2="194" y2="227"/>
  <line class="axis" x1="206" y1="37" x2="206" y2="227"/>
  <circle class="f3" cx="200" cy="132" r="2.5"/>
  <text x="214" y="137">centre</text>
  <!-- a small figure standing at the entrance -->
  <circle class="axis" cx="222" cy="12" r="6" style="fill:var(--surface)"/>
  <line class="l3 thin" x1="222" y1="18" x2="222" y2="30"/>
  <line class="l3 thin" x1="214" y1="27" x2="230" y2="23"/>
  <line class="l3 thin" x1="222" y1="30" x2="218" y2="39"/>
  <line class="l3 thin" x1="222" y1="30" x2="226" y2="39"/>
  <text x="238" y="22">you</text>
  <text x="186" y="28" text-anchor="end">tunnel</text>
  <text x="98" y="232">Earth</text>
  <text x="200" y="250" text-anchor="middle">far end</text>
</svg>
