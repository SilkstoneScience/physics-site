<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <!-- The East Wing of the Ravensby Pumping Station Museum: the Engine Hall and the archive. Our own drawing. Numbered markers are added by js/mystery.js. -->
  <rect x="10" y="20" width="620" height="300" style="fill: var(--surface)" stroke="currentColor" stroke-width="2"/>
  <line x1="10" y1="300" x2="630" y2="300" stroke="currentColor" stroke-width="2"/>
  <text x="22" y="44" font-size="14">Engine Hall</text>
  <text x="430" y="44" font-size="14">Archive</text>
  <!-- The great flywheel: rim, spokes, hub and stand -->
  <circle cx="200" cy="170" r="115" fill="none" stroke="currentColor" stroke-width="10"/>
  <line x1="200" y1="170" x2="200" y2="60" stroke="currentColor" stroke-width="5" opacity="0.45"/>
  <line x1="200" y1="170" x2="295" y2="115" stroke="currentColor" stroke-width="4"/>
  <line x1="200" y1="170" x2="295" y2="225" stroke="currentColor" stroke-width="4"/>
  <line x1="200" y1="170" x2="200" y2="280" stroke="currentColor" stroke-width="4"/>
  <line x1="200" y1="170" x2="105" y2="225" stroke="currentColor" stroke-width="4"/>
  <line x1="200" y1="170" x2="105" y2="115" stroke="currentColor" stroke-width="4"/>
  <circle cx="200" cy="170" r="16" style="fill: var(--bg)" stroke="currentColor" stroke-width="3"/>
  <path d="M170 300 L188 170 L212 170 L230 300 Z" style="fill: var(--theme-b); opacity: 0.35" stroke="currentColor" stroke-width="2"/>
  <!-- A phone lying on the rail in front of the flywheel -->
  <rect x="330" y="262" width="16" height="28" rx="3" style="fill: var(--bg)" stroke="currentColor" stroke-width="2"/>
  <line x1="320" y1="290" x2="380" y2="290" stroke="currentColor" stroke-width="3"/>
  <!-- Wall between the hall and the archive, with the door shut -->
  <rect x="400" y="20" width="12" height="280" style="fill: var(--bg)" stroke="currentColor" stroke-width="2"/>
  <rect x="402" y="140" width="8" height="160" style="fill: var(--theme-b); opacity: 0.55" stroke="currentColor" stroke-width="1.5"/>
  <!-- Magnet on the door edge and coil in the frame -->
  <rect x="402" y="146" width="8" height="10" class="f3"/>
  <path d="M414 144 q6 3 0 6 q6 3 0 6 q6 3 0 6" fill="none" stroke="currentColor" stroke-width="2"/>
  <!-- Photocell on the archive wall -->
  <rect x="580" y="70" width="34" height="22" style="fill: var(--bg)" stroke="currentColor" stroke-width="2"/>
  <circle cx="590" cy="81" r="6" style="fill: var(--accent-soft)" stroke="currentColor" stroke-width="1.5"/>
  <!-- Cabinet with its lid prised up -->
  <rect x="470" y="220" width="110" height="80" style="fill: var(--bg)" stroke="currentColor" stroke-width="2"/>
  <path d="M470 220 L578 204" fill="none" stroke="currentColor" stroke-width="3"/>
  <rect x="500" y="240" width="50" height="34" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4 4"/>
  <!-- Small object behind the cabinet -->
  <rect x="586" y="288" width="14" height="10" rx="2" style="fill: var(--surface)" stroke="currentColor" stroke-width="1.5"/>
</svg>
