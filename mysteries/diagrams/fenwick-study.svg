<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430">
  <!-- The professor's study at Fenwick Hall, with the drive and gate shown below. Our own drawing. Numbered markers are added by js/mystery.js. -->
  <rect x="10" y="20" width="620" height="290" style="fill: var(--surface)" stroke="currentColor" stroke-width="2"/>
  <line x1="10" y1="290" x2="630" y2="290" stroke="currentColor" stroke-width="2"/>
  <!-- Window, with one smashed pane -->
  <rect x="35" y="70" width="110" height="140" style="fill: var(--accent-soft)" stroke="currentColor" stroke-width="3"/>
  <line x1="90" y1="70" x2="90" y2="210" stroke="currentColor" stroke-width="2"/>
  <line x1="35" y1="140" x2="145" y2="140" stroke="currentColor" stroke-width="2"/>
  <path d="M92 142 L143 142 L143 208 L92 208 L104 186 L96 170 L114 176 L108 156 L126 166 L120 148 Z" style="fill: var(--bg)" stroke="currentColor" stroke-width="1.5"/>
  <!-- Broken glass on the floor -->
  <path d="M60 283 L70 272 L76 285 Z M92 286 L104 276 L108 287 Z M124 282 L134 270 L142 285 Z M154 287 L162 279 L168 288 Z M38 287 L46 280 L50 288 Z" style="fill: var(--accent-soft)" stroke="currentColor" stroke-width="1.2"/>
  <!-- Desk -->
  <rect x="205" y="208" width="200" height="12" style="fill: var(--theme-b); opacity: 0.55" stroke="currentColor" stroke-width="2"/>
  <rect x="215" y="220" width="12" height="70" style="fill: var(--theme-b); opacity: 0.55" stroke="currentColor" stroke-width="2"/>
  <rect x="383" y="220" width="12" height="70" style="fill: var(--theme-b); opacity: 0.55" stroke="currentColor" stroke-width="2"/>
  <!-- Desk lamp -->
  <line x1="240" y1="208" x2="240" y2="160" stroke="currentColor" stroke-width="3"/>
  <path d="M220 160 L260 160 L250 134 L230 134 Z" style="fill: var(--warn-soft)" stroke="currentColor" stroke-width="2"/>
  <!-- Mug of cocoa -->
  <path d="M286 180 L316 180 L316 208 L286 208 Z" style="fill: var(--bg)" stroke="currentColor" stroke-width="2"/>
  <path d="M316 186 C328 186 328 202 316 202" fill="none" stroke="currentColor" stroke-width="2"/>
  <!-- Empty, torn envelope -->
  <path d="M340 196 L394 196 L394 208 L340 208 Z" style="fill: var(--bg)" stroke="currentColor" stroke-width="1.5"/>
  <path d="M340 196 L367 204 L394 196" fill="none" stroke="currentColor" stroke-width="1.2"/>
  <!-- Display cabinet with an empty stand -->
  <rect x="440" y="80" width="90" height="210" style="fill: var(--bg)" stroke="currentColor" stroke-width="2"/>
  <line x1="440" y1="200" x2="530" y2="200" stroke="currentColor" stroke-width="2"/>
  <rect x="470" y="178" width="30" height="22" style="fill: var(--surface)" stroke="currentColor" stroke-width="1.5"/>
  <path d="M485 112 C498 112 497 134 492 144 C498 156 496 178 496 178 L474 178 C474 178 472 156 478 144 C473 134 472 112 485 112 Z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="4 4"/>
  <!-- Doorway to the hall, with the long-case clock -->
  <rect x="548" y="55" width="72" height="235" style="fill: var(--bg)" stroke="currentColor" stroke-width="2"/>
  <rect x="566" y="72" width="36" height="218" style="fill: var(--surface)" stroke="currentColor" stroke-width="2"/>
  <circle cx="584" cy="96" r="14" style="fill: var(--bg)" stroke="currentColor" stroke-width="2"/>
  <line x1="584" y1="96" x2="594" y2="100.5" stroke="currentColor" stroke-width="2"/>
  <line x1="584" y1="96" x2="578" y2="91" stroke="currentColor" stroke-width="2"/>
  <rect x="572" y="118" width="24" height="150" style="fill: var(--bg)" stroke="currentColor" stroke-width="1.5"/>
  <line x1="584" y1="120" x2="584" y2="240" stroke="currentColor" stroke-width="2"/>
  <circle cx="584" cy="246" r="9" class="f3"/>
  <!-- The drive and gate, outside the house -->
  <rect x="10" y="330" width="620" height="90" style="fill: var(--bg)" stroke="currentColor" stroke-width="2"/>
  <text x="22" y="352" font-size="14">Outside: the lane</text>
  <line x1="170" y1="380" x2="430" y2="380" stroke="currentColor" stroke-width="5" opacity="0.65"/>
  <line x1="170" y1="404" x2="430" y2="404" stroke="currentColor" stroke-width="5" opacity="0.65"/>
  <!-- Gate -->
  <rect x="470" y="352" width="8" height="66" class="f3"/>
  <rect x="598" y="352" width="8" height="66" class="f3"/>
  <line x1="478" y1="364" x2="598" y2="364" stroke="currentColor" stroke-width="3"/>
  <line x1="478" y1="404" x2="598" y2="404" stroke="currentColor" stroke-width="3"/>
  <line x1="508" y1="364" x2="508" y2="404" stroke="currentColor" stroke-width="2"/>
  <line x1="538" y1="364" x2="538" y2="404" stroke="currentColor" stroke-width="2"/>
  <line x1="568" y1="364" x2="568" y2="404" stroke="currentColor" stroke-width="2"/>
</svg>
