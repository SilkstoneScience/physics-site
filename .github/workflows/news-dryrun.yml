# Science news, Stage 0 (dry run). Commits nothing and publishes nothing.
# Runs the collector on GitHub's computers and shows what it WOULD publish:
# github.com → physics-site → Actions → "Science news dry run" → a run. Signed in, the full report is on the run's
# summary page; the AI summaries and the pick also appear as notes ("Annotations") there.
# Runs Mon/Wed/Fri at 06:05 UTC (GitHub may start timed runs a little late), whenever the collector changes,
# and when "Run workflow" is pressed on that Actions page.
# The run fails (and GitHub emails) if the ANTHROPIC_API_KEY secret is refused, e.g. after the key expires.
name: Science news dry run
on:
  schedule:
    - cron: '5 6 * * 1,3,5'
  push:
    branches: [main, science-news]
    paths: ['tools/news/**', '.github/workflows/news-dryrun.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: science-news
  cancel-in-progress: false
jobs:
  dryrun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install the collector's libraries
        working-directory: tools/news
        run: npm ci
      - name: Collect and summarise (dry run)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node tools/news/collect.mjs --dry-run --report "$GITHUB_STEP_SUMMARY"
