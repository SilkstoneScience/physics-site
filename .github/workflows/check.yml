# Runs tools/check.mjs on every push. If it finds errors, GitHub emails the person who pushed
# and shows a red ✗ next to the commit. (It doesn't stop the site updating.)
name: Check site
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tools/check.mjs
