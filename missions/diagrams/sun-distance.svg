<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 160">
  <!-- Distances to scale (95 px per AU); sizes not to scale. Sun at x = 34, Earth at 129, Jupiter at 528. -->
  <line x1="34" y1="80" x2="540" y2="80" class="grid"/>
  <circle cx="34" cy="80" r="22" style="fill: var(--theme-b); opacity: 0.8"/>
  <circle cx="129" cy="80" r="6" class="f1"/>
  <circle cx="528" cy="80" r="15" style="fill: var(--surface)" stroke="currentColor" stroke-width="2"/>
  <line x1="514" y1="75" x2="542" y2="75" class="l3" style="stroke-width: 1.5"/><line x1="514" y1="85" x2="542" y2="85" class="l3" style="stroke-width: 1.5"/>
  <!-- The ship, heading outwards -->
  <polygon points="318,73 336,80 318,87" class="f3"/>
  <line x1="300" y1="80" x2="316" y2="80" class="l2 thin dash"/>
  <!-- 1.0 AU -->
  <line x1="34" y1="30" x2="129" y2="30" class="l3 thin"/>
  <polygon points="34,30 44,25 44,35" class="f3"/><polygon points="129,30 119,25 119,35" class="f3"/>
  <text x="82" y="22" text-anchor="middle" font-size="13">1.0 AU</text>
  <!-- 5.2 AU -->
  <line x1="34" y1="134" x2="528" y2="134" class="l3 thin"/>
  <polygon points="34,134 44,129 44,139" class="f3"/><polygon points="528,134 518,129 518,139" class="f3"/>
  <text x="281" y="154" text-anchor="middle" font-size="13">5.2 AU</text>
  <!-- Labels -->
  <text x="34" y="118" text-anchor="middle" font-size="13">Sun</text>
  <text x="140" y="66" text-anchor="start" font-size="13">Earth</text>
  <text x="552" y="54" text-anchor="end" font-size="13">Jupiter</text>
  <text x="327" y="62" text-anchor="middle" font-size="13">Kittiwake</text>
</svg>
