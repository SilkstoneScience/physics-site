<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 260">
  <!-- Jupiter with Europa's orbit; the Kittiwake approaching from the left. Not to scale. -->
  <circle cx="280" cy="130" r="105" class="grid" style="fill: none; stroke-width: 2" stroke-dasharray="6 5"/>
  <circle cx="280" cy="130" r="34" style="fill: var(--warn-soft)" stroke="currentColor" stroke-width="2"/>
  <path d="M249 118 H311 M247 130 H313 M249 142 H311" class="l3 thin" style="opacity: 0.45"/>
  <circle cx="354" cy="56" r="9" style="fill: var(--surface)" stroke="currentColor" stroke-width="2"/>
  <!-- The ship -->
  <polygon points="72,124 92,130 72,136" class="f3"/>
  <line x1="40" y1="130" x2="70" y2="130" class="l2 thin dash"/>
  <!-- Labels -->
  <text x="280" y="186" text-anchor="middle" font-size="13">Jupiter</text>
  <text x="372" y="44" text-anchor="start" font-size="13">Europa</text>
  <text x="66" y="112" text-anchor="middle" font-size="13">Kittiwake</text>
  <text x="455" y="246" text-anchor="end" font-size="13">Europa's orbit</text>
</svg>
