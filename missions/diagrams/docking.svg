<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 170">
  <!-- The Petrel (left) approaching the Kittiwake (right, at rest). Not to scale. -->
  <!-- Petrel -->
  <polygon points="30,70 80,70 96,85 80,100 30,100" style="fill: var(--surface)" stroke="currentColor" stroke-width="2"/>
  <line x1="40" y1="100" x2="30" y2="114" class="l3 thin"/><line x1="70" y1="100" x2="80" y2="114" class="l3 thin"/>
  <line x1="104" y1="85" x2="150" y2="85" class="l1 thin"/>
  <polygon points="148,79 160,85 148,91" class="f1"/>
  <!-- Kittiwake: habitat and docking port facing left -->
  <rect x="200" y="78" width="14" height="14" style="fill: var(--surface)" stroke="currentColor" stroke-width="2"/>
  <rect x="214" y="58" width="90" height="54" rx="10" style="fill: var(--surface)" stroke="currentColor" stroke-width="2"/>
  <line x1="304" y1="85" x2="440" y2="85" class="l3"/>
  <rect x="330" y="68" width="60" height="34" rx="12" style="fill: var(--surface)" stroke="currentColor" stroke-width="2"/>
  <line x1="400" y1="48" x2="400" y2="122" class="l3 thin"/>
  <!-- Labels -->
  <text x="62" y="140" text-anchor="middle" font-size="13">Petrel</text>
  <text x="130" y="68" text-anchor="middle" font-size="13" class="t1">0.60 m/s</text>
  <text x="320" y="146" text-anchor="middle" font-size="13">Kittiwake (at rest)</text>
</svg>
