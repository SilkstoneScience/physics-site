<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 210">
  <!-- The Kittiwake, side view, pointing right. Not to scale. -->
  <!-- Propellant leaving the drive -->
  <g class="l2 thin dash">
    <line x1="68" y1="94" x2="12" y2="80"/><line x1="68" y1="100" x2="8" y2="100"/><line x1="68" y1="106" x2="12" y2="120"/>
  </g>
  <!-- Drive nozzle -->
  <polygon points="68,82 100,93 100,107 68,118" style="fill: var(--surface)" stroke="currentColor" stroke-width="2"/>
  <!-- Reactor and its radiation shield -->
  <rect x="100" y="88" width="26" height="24" rx="3" style="fill: var(--theme-b); opacity: 0.45" stroke="currentColor" stroke-width="2"/>
  <rect x="128" y="70" width="7" height="60" class="f3"/>
  <!-- Radiators -->
  <line x1="185" y1="94" x2="185" y2="66" class="l3 thin"/><line x1="185" y1="106" x2="185" y2="134" class="l3 thin"/>
  <rect x="145" y="60" width="80" height="6" style="fill: var(--surface)" stroke="currentColor" stroke-width="1.5"/>
  <rect x="145" y="134" width="80" height="6" style="fill: var(--surface)" stroke="currentColor" stroke-width="1.5"/>
  <!-- Frame (truss) -->
  <line x1="135" y1="94" x2="382" y2="94" class="l3 thin"/><line x1="135" y1="106" x2="382" y2="106" class="l3 thin"/>
  <polyline points="135,106 147,94 159,106 171,94 183,106 195,94 207,106 219,94 231,106 243,94 255,106 267,94 279,106 291,94 303,106 315,94 327,106 339,94 351,106 363,94 375,106 382,99" class="l3" style="stroke-width: 1"/>
  <!-- Propellant tanks -->
  <rect x="240" y="70" width="88" height="22" rx="11" style="fill: var(--surface)" stroke="currentColor" stroke-width="2"/>
  <rect x="240" y="108" width="88" height="22" rx="11" style="fill: var(--surface)" stroke="currentColor" stroke-width="2"/>
  <!-- Solar panels on a mast -->
  <line x1="347" y1="94" x2="347" y2="62" class="l3 thin"/><line x1="347" y1="106" x2="347" y2="138" class="l3 thin"/>
  <rect x="330" y="20" width="34" height="42" style="fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2"/>
  <rect x="330" y="138" width="34" height="42" style="fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2"/>
  <line x1="330" y1="41" x2="364" y2="41" style="stroke: var(--accent); stroke-width: 1"/><line x1="330" y1="159" x2="364" y2="159" style="stroke: var(--accent); stroke-width: 1"/>
  <!-- Habitat with windows, and its nose -->
  <rect x="382" y="78" width="108" height="44" rx="8" style="fill: var(--surface)" stroke="currentColor" stroke-width="2"/>
  <polygon points="490,80 524,100 490,120" style="fill: var(--surface)" stroke="currentColor" stroke-width="2"/>
  <circle cx="465" cy="100" r="5" style="fill: var(--accent-soft)" stroke="currentColor" stroke-width="1.5"/>
  <circle cx="447" cy="100" r="5" style="fill: var(--accent-soft)" stroke="currentColor" stroke-width="1.5"/>
  <!-- Petrel lander docked on top -->
  <polygon points="405,78 412,58 446,58 453,78" style="fill: var(--surface)" stroke="currentColor" stroke-width="2"/>
  <line x1="412" y1="66" x2="400" y2="76" class="l3 thin"/><line x1="446" y1="66" x2="458" y2="76" class="l3 thin"/>
  <!-- Labels -->
  <text x="40" y="66" text-anchor="middle" font-size="13">drive</text>
  <text x="113" y="192" text-anchor="middle" font-size="13">reactor</text>
  <line x1="113" y1="178" x2="113" y2="114" class="grid"/>
  <text x="132" y="52" text-anchor="middle" font-size="13">shield</text>
  <text x="185" y="164" text-anchor="middle" font-size="13">radiators</text>
  <text x="284" y="152" text-anchor="middle" font-size="13">tanks</text>
  <text x="347" y="200" text-anchor="middle" font-size="13" class="t1">solar panels</text>
  <text x="429" y="44" text-anchor="middle" font-size="13">Petrel</text>
  <text x="436" y="146" text-anchor="middle" font-size="13">habitat</text>
</svg>
