# GitHub Pages settings.
# The pages are plain HTML (no front matter), so GitHub's Jekyll copies them unchanged.
# Its only job here is to leave out files that are for building the site, not for students.
# Hidden files and folders (.claude, .gitignore) are left out automatically.
# Add any new non-site file or folder to this list.
exclude:
  - CLAUDE.md
  - CLAUDE.local.md
  - README.md
  - PROGRESS.md
  - docs/
  - tools/
  - preview.bat
